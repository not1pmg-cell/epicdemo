<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Uzs TV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #f43f5e;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: #1f293d;
        }
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            color: var(--text-primary); font-family: sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; background-color: #0e1422; border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 20px; font-weight: 800; color: var(--accent); }
        .search-container { padding: 14px 20px; }
        .search-box input {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            border: 1px solid var(--border-color); background-color: var(--card-bg);
            color: var(--text-primary); font-size: 15px; outline: none;
        }
        .categories-scroll {
            display: flex; gap: 10px; padding: 0 20px 14px 20px; overflow-x: auto; scrollbar-width: none;
        }
        .cat-btn {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 8px 18px; border-radius: 20px;
            cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap;
        }
        .cat-btn.active { background-color: var(--accent); color: #ffffff; border-color: var(--accent); }
        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px; padding: 0 20px 24px 20px; flex: 1;
        }
        .card {
            background-color: var(--card-bg); border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column;
        }
        .card-poster { height: 130px; background-color: #1e293b; position: relative; background-size: cover; background-position: center; }
        .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
        .card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 700; margin: 0; }
        .card-footer { font-size: 11px; color: var(--text-secondary); }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95); display: none; flex-direction: column; z-index: 1000;
        }
        .modal-header {
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            background-color: #0e1422; border-bottom: 1px solid var(--border-color);
        }
        .modal-title { font-size: 16px; font-weight: 700; margin: 0; max-width: 75%; overflow: hidden; text-overflow: ellipsis; }
        .close-btn { background-color: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .player-container { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        video, iframe { width: 100%; max-height: 100vh; aspect-ratio: 16/9; border: none; outline: none; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>

<header>
    <div class="logo">📺 Uzs TV</div>
    <div id="userName" style="font-size: 13px; color: var(--text-secondary);">Foydalanuvchi</div>
</header>

<div class="search-container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Qidirish...">
    </div>
</div>

<div class="categories-scroll">
    <button class="cat-btn active" onclick="filterCat('all', this)">Barchasi</button>
    <button class="cat-btn" onclick="filterCat('Sport', this)">⚽ Sport</button>
    <button class="cat-btn" onclick="filterCat('TV', this)">📺 TV</button>
    <button class="cat-btn" onclick="filterCat('Multfilm', this)">🧒 Multfilm</button>
    <button class="cat-btn" onclick="filterCat('Kino', this)">🎥 Kino</button>
</div>

<div class="content-grid" id="grid"></div>

<div class="modal" id="playerModal">
    <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Pleyer</h3>
        <button class="close-btn" onclick="closePlayer()">Yopish</button>
    </div>
    <div class="player-container">
        <video id="player" controls playsinline style="display:none;"></video>
        <iframe id="ytPlayer" allowfullscreen style="display:none;" allow="autoplay; encrypted-media"></iframe>
    </div>
</div>

<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    if (Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
        document.getElementById('userName').textContent = Telegram.WebApp.initDataUnsafe.user.first_name || "Foydalanuvchi";
    }

    // Admin panel qo'shgan barcha kontentlar shu yerga avtomatik keladi yoki namuna ro'yxat
    const items = [
        {
            title: "Togrivoy va Egrivoy",
            category: "Multfilm",
            badge: "Multfilm",
            url: "https://www.youtube.com/watch?v=jNQXAC9IVRw", // Ishlaydigan test YouTube havolasi
            poster: "https://images.unsplash.com/photo-1560942446-b8a542969f56?w=500"
        }
    ];

    function renderItems(data) {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        if (data.length === 0) {
            grid.innerHTML = `<div class="empty-state"><h3>Hech narsa topilmadi</h3></div>`;
            return;
        }
        data.forEach(item => {
            // Admin panelda rasm havolasi (-) yuborilsa, chiroyli avtomatik rasm qo'yiladi
            const posterImg = (item.poster && item.poster.startsWith("http")) 
                ? item.poster 
                : "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500";

            grid.innerHTML += `
                <div class="card" onclick="openPlayer('${item.title.replace(/'/g, "\\'")}', '${item.url}')">
                    <div class="card-poster" style="background-image: url('${posterImg}')">
                        <div class="badge">${item.badge || item.category}</div>
                    </div>
                    <div class="card-body">
                        <p class="card-title">${item.title}</p>
                        <div class="card-footer">${item.category}</div>
                    </div>
                </div>
            `;
        });
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (cat === 'all') {
            renderItems(items);
        } else {
            renderItems(items.filter(x => x.category.toLowerCase() === cat.toLowerCase()));
        }
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        renderItems(items.filter(x => x.title.toLowerCase().includes(q)));
    });

    function getYouTubeId(u) {
        const match = u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function openPlayer(title, url) {
        document.getElementById("modalTitle").textContent = title;
        const modal = document.getElementById("playerModal");
        const video = document.getElementById("player");
        const yt = document.getElementById("ytPlayer");
        modal.style.display = "flex";

        const ytId = getYouTubeId(url);
        if (ytId) {
            video.style.display = "none";
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        } else if (url.includes(".m3u8")) {
            yt.style.display = "none";
            video.style.display = "block";
            if (window.Hls && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            }
        } else {
            yt.style.display = "none";
            video.style.display = "block";
            video.src = url;
            video.play();
        }
    }

    function closePlayer() {
        const modal = document.getElementById("playerModal");
        const video = document.getElementById("player");
        const yt = document.getElementById("ytPlayer");
        modal.style.display = "none";
        video.pause();
        video.src = "";
        yt.src = "";
    }

    renderItems(items);
</script>
</body>
</html>
