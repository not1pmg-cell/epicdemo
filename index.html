<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Uzs TV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-base: #07090e; --bg-surface: #121824; --bg-card: #182030;
            --accent: #e50914; --text-main: #f9fafb; --text-muted: #9ca3af; --border: #222f43;
        }
        :root[data-theme="light"] {
            --bg-base: #f3f4f6; --bg-surface: #ffffff; --bg-card: #e5e7eb;
            --accent: #e50914; --text-main: #111827; --text-muted: #4b5563; --border: #d1d5db;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: var(--bg-base); color: var(--text-main); font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 900; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .icon-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .search-area { padding: 16px 20px 8px 20px; }
        .search-wrapper { position: relative; }
        .search-wrapper input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 12px; border: 1px solid var(--border); background-color: var(--bg-surface); color: var(--text-main); font-size: 14px; outline: none; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .categories-bar { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; scrollbar-width: none; }
        .categories-bar::-webkit-scrollbar { display: none; }
        .chip { background-color: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted); padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
        .chip.active { background-color: var(--text-main); color: var(--bg-base); border-color: var(--text-main); }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 10px 20px 24px 20px; flex: 1; }
        @media (min-width: 550px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        .movie-card { background-color: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; }
        .poster-box { height: 140px; background-color: #111; position: relative; background-size: cover; background-position: center; }
        .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
        .card-details { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
        .movie-title { font-size: 13px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-category { font-size: 11px; color: var(--text-muted); }
        .settings-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; }
        .settings-box { background-color: var(--bg-surface); width: 100%; max-width: 400px; border-radius: 16px; border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .player-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.96); display: none; flex-direction: column; z-index: 1000; }
        .modal-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); }
        .modal-heading { font-size: 15px; font-weight: 700; margin: 0; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .exit-btn { background-color: var(--accent); border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; }
        .video-wrapper { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        video, iframe { width: 100%; max-height: 100vh; aspect-ratio: 16/9; border: none; outline: none; }
        .not-found { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Uzs TV</div>
    <button class="icon-btn" onclick="openSettings()">⚙️ Sozlamalar</button>
</header>

<div class="search-area">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Qidirish...">
    </div>
</div>

<div class="categories-bar">
    <button class="chip active" onclick="filterCat('all', this)">Barchasi</button>
    <button class="chip" onclick="filterCat('cartoons', this)">Multfilmlar</button>
</div>

<div class="grid-container" id="grid"></div>

<div class="settings-modal" id="settingsModal">
    <div class="settings-box">
        <h3>⚙️ Sozlamalar</h3>
        <button class="exit-btn" onclick="closeSettings()" style="width:100%; padding:10px;">Yopish</button>
    </div>
</div>

<div class="player-modal" id="playerModal">
    <div class="modal-top">
        <h3 class="modal-heading" id="modalTitle">Pleyer</h3>
        <button class="exit-btn" onclick="closePlayer()">Yopish</button>
    </div>
    <div class="video-wrapper">
        <video id="player" controls playsinline style="display:none;"></video>
        <iframe id="ytPlayer" allowfullscreen style="display:none;" allow="autoplay; encrypted-media"></iframe>
    </div>
</div>

<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    // SHU YERGA O'ZINGizNING HAQIQIY YOUTUBE VIDESINGIZ HAVOLASINI YOZING:
    const items = [
        {
            title: "Togrivoy va Egrivoy",
            content_type: "cartoons",
            category: "Multfilmlar",
            badge: "MULTFILM",
            url: "https://www.youtube.com/watch?v=SIZNING_YOUTUBE_KODINGIZ", // <-- O'z havolangizni shu yerga qo'ying
            poster: "https://images.unsplash.com/photo-1560942446-b8a542969f56?w=500"
        }
    ];

    function renderItems(data) {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        data.forEach(item => {
            grid.innerHTML += `
                <div class="movie-card" onclick="openPlayer('${item.title}', '${item.url}')">
                    <div class="poster-box" style="background-image: url('${item.poster}')">
                        <div class="tag">${item.badge}</div>
                    </div>
                    <div class="card-details">
                        <p class="movie-title">${item.title}</p>
                        <span class="movie-category">${item.category}</span>
                    </div>
                </div>
            `;
        });
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (cat === 'all') { renderItems(items); } 
        else { renderItems(items.filter(x => x.content_type === cat)); }
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        renderItems(items.filter(x => x.title.toLowerCase().includes(q)));
    });

    function getYouTubeId(u) {
        const match = u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function openPlayer(title, url) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("playerModal").style.display = "flex";
        const ytId = getYouTubeId(url);
        if (ytId) {
            document.getElementById("player").style.display = "none";
            const yt = document.getElementById("ytPlayer");
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        }
    }

    function closePlayer() {
        document.getElementById("playerModal").style.display = "none";
        document.getElementById("ytPlayer").src = "";
    }

    renderItems(items);
</script>
</body>
</html>
