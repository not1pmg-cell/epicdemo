<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Uzs TV - Premium Streaming</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-base: #07090e; --bg-surface: #101726; --bg-card: #182238;
            --accent: #e50914; --text-main: #ffffff; --text-muted: #94a3b8; --border: #22304d;
            --shadow: rgba(0, 0, 0, 0.4);
        }
        :root[data-theme="light"] {
            --bg-base: #f1f5f9; --bg-surface: #ffffff; --bg-card: #ffffff;
            --accent: #e50914; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0 0 80px 0; background-color: var(--bg-base); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        
        /* Header */
        header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px var(--shadow); }
        .logo { font-size: 22px; font-weight: 900; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
        .header-btns { display: flex; gap: 8px; }
        .action-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .action-btn:active { transform: scale(0.95); }

        /* Search Section */
        .search-area { padding: 16px 20px 8px 20px; }
        .search-wrapper { position: relative; }
        .search-wrapper input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 14px; border: 1px solid var(--border); background-color: var(--bg-surface); color: var(--text-main); font-size: 14px; outline: none; box-shadow: inset 0 2px 4px var(--shadow); transition: border-color 0.2s; }
        .search-wrapper input:focus { border-color: var(--accent); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }

        /* Hero Banner */
        .hero-banner { margin: 10px 20px; height: 160px; border-radius: 16px; background: linear-gradient(135deg, #1e293b, #0f172a); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; box-shadow: 0 8px 24px var(--shadow); }
        .hero-banner::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0.35; z-index: 1; }
        .hero-content { position: relative; z-index: 2; }
        .hero-tag { background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; display: inline-block; margin-bottom: 6px; }
        .hero-title { font-size: 18px; font-weight: 800; margin: 0 0 4px 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .hero-desc { font-size: 12px; color: #cbd5e1; margin: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }

        /* Grid Section */
        .section-title { font-size: 16px; font-weight: 800; margin: 16px 20px 8px 20px; display: flex; justify-content: space-between; align-items: center; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 20px 20px 20px; }
        .movie-card { background-color: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 4px 14px var(--shadow); position: relative; transition: transform 0.2s; }
        .movie-card:active { transform: scale(0.98); }
        
        .poster-box { height: 160px; background-color: #1a2233; position: relative; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; }
        .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; z-index: 2; }
        
        .fav-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 16px; z-index: 5; transition: 0.2s; }
        .fav-btn.active { color: #facc15; background: rgba(250, 204, 21, 0.2); }

        .card-details { padding: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .movie-title { font-size: 13px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-category { font-size: 11px; color: var(--text-muted); }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--bg-surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 20px var(--shadow); }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex: 1; transition: 0.2s; }
        .nav-item.active { color: var(--accent); }
        .nav-item span { font-size: 20px; }

        /* Player Modal */
        .player-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.96); display: none; flex-direction: column; z-index: 1000; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); }
        .modal-heading { font-size: 15px; font-weight: 700; margin: 0; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .exit-btn { background-color: var(--accent); border: none; color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; }
        .video-wrapper { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        video, iframe { width: 100%; height: 100%; max-height: 100vh; border: none; outline: none; }
        .not-found { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Uzs TV</div>
    <div class="header-btns">
        <button class="action-btn" onclick="filterFavorites()">⭐ Sevimlilar</button>
        <button class="action-btn" onclick="toggleTheme()">☀️/🌙</button>
    </div>
</header>

<div class="search-area">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Kinolar, multfilmlar va seriallarni qidirish...">
    </div>
</div>

<div class="hero-banner" id="heroBanner">
    <div class="hero-content">
        <div class="hero-tag">Premyera</div>
        <h2 class="hero-title" id="heroTitle">Uzs TV Platformasiga Xush Kelibsiz</h2>
        <p class="hero-desc">Eng sara filmlar va multfilmlar bir joyda</p>
    </div>
</div>

<div class="section-title">
    <span id="sectionHeaderTitle">Barcha Kontentlar</span>
</div>

<div class="grid-container" id="grid">Yuklanmoqda...</div>

<!-- Bottom Navigation Menu -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="filterCategory('all', this)"><span>🏠</span>Barchasi</button>
    <button class="nav-item" onclick="filterCategory('tv', this)"><span>📺</span>TV</button>
    <button class="nav-item" onclick="filterCategory('cartoons', this)"><span>🧸</span>Multfilm</button>
    <button class="nav-item" onclick="filterCategory('movies', this)"><span>🎬</span>Kino</button>
    <button class="nav-item" onclick="filterCategory('series', this)"><span>📼</span>Serial</button>
    <button class="nav-item" onclick="filterCategory('football', this)"><span>⚽</span>Futbol</button>
</nav>

<!-- Video Player Modal -->
<div class="player-modal" id="playerModal">
    <div class="modal-top">
        <h3 class="modal-heading" id="modalTitle">Pleyer</h3>
        <button class="exit-btn" onclick="closePlayer()">Yopish</button>
    </div>
    <div class="video-wrapper">
        <video id="nativePlayer" controls playsinline style="display:none;"></video>
        <iframe id="ytPlayer" allowfullscreen allow="autoplay; encrypted-media" style="display:none;"></iframe>
    </div>
</div>

<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let items = [];
    let currentCategory = 'all';
    let onlyFavorites = false;
    let favorites = JSON.parse(localStorage.getItem('uzstv_favs') || '[]');

    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute("data-theme");
        html.setAttribute("data-theme", current === "dark" ? "light" : "dark");
    }

    async function loadData() {
        try {
            const res = await fetch('data.json');
            const data = await res.json();
            items = data.items || [];
            
            if (items.length > 0) {
                const featured = items[Math.floor(Math.random() * items.length)];
                const banner = document.getElementById('heroBanner');
                document.getElementById('heroTitle').textContent = featured.title;
                document.getElementById('heroDesc').textContent = `Kategoriya: ${featured.category || 'Maxsus'} | Til: ${featured.language.toUpperCase()}`;
                if (featured.poster) {
                    banner.style.setProperty('--banner-bg', `url('${featured.poster}')`);
                    banner.querySelector('::before, .hero-banner').style.backgroundImage = `url('${featured.poster}')`;
                }
            }

            renderItems(items);
        } catch (e) {
            document.getElementById('grid').innerHTML = `<div class="not-found">Ma'lumotlarni yuklab bo'lmadi. ` + e.message + `</div>`;
        }
    }

    function renderItems(data) {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        
        let filtered = data;
        
        if (onlyFavorites) {
            filtered = filtered.filter(x => favorites.includes(x.id));
            document.getElementById('sectionHeaderTitle').textContent = "Saqlangan Sevimlilar";
        } else if (currentCategory !== 'all') {
            filtered = filtered.filter(x => x.content_type === currentCategory);
            document.getElementById('sectionHeaderTitle').textContent = currentCategory.toUpperCase() + " Bo'limi";
        } else {
            document.getElementById('sectionHeaderTitle').textContent = "Barcha Kontentlar";
        }

        const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
        if (searchQuery) {
            filtered = filtered.filter(x => x.title.toLowerCase().includes(searchQuery) || (x.category && x.category.toLowerCase().includes(searchQuery)));
        }

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="not-found">Hozircha bu bo'limda hech narsa topilmadi</div>`;
            return;
        }

        filtered.forEach(item => {
            let posterStyle = item.poster ? `background-image: url('${item.poster}');` : "";
            let isFav = favorites.includes(item.id);
            let safeTitle = item.title.replace(/'/g, "\\'");

            grid.innerHTML += `
                <div class="movie-card">
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${item.id})">★</button>
                    <div class="poster-box" style="${posterStyle}" onclick="openPlayer('${safeTitle}', '${item.url}')">
                        <div class="tag">${item.badge || 'TV'}</div>
                        ${!item.poster ? `<span>🎬 ${item.title}</span>` : ''}
                    </div>
                    <div class="card-details" onclick="openPlayer('${safeTitle}', '${item.url}')">
                        <p class="movie-title">${item.title}</p>
                        <span class="movie-category">${item.category || ''}</span>
                    </div>
                </div>
            `;
        });
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        onlyFavorites = false;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(btn) btn.classList.add('active');
        renderItems(items);
    }

    function filterFavorites() {
        onlyFavorites = !onlyFavorites;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        renderItems(items);
    }

    function toggleFav(id) {
        if (favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('uzstv_favs', JSON.stringify(favorites));
        renderItems(items);
    }

    document.getElementById("searchInput").addEventListener("input", () => {
        renderItems(items);
    });

    function openPlayer(title, url) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("playerModal").style.display = "flex";
        
        const nativePlayer = document.getElementById("nativePlayer");
        const ytPlayer = document.getElementById("ytPlayer");

        if (url.includes("youtube.com") || url.includes("youtu.be")) {
            nativePlayer.style.display = "none";
            nativePlayer.pause();
            nativePlayer.src = "";
            ytPlayer.style.display = "block";
            
            let ytId = "";
            if (url.includes("youtu.be/")) {
                ytId = url.split("youtu.be/")[1]?.split("?")[0];
            } else if (url.includes("watch?v=")) {
                ytId = url.split("watch?v=")[1]?.split("&")[0];
            }
            ytPlayer.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        } else {
            ytPlayer.style.display = "none";
            ytPlayer.src = "";
            nativePlayer.style.display = "block";
            nativePlayer.src = url;
            nativePlayer.play();
        }
    }

    function closePlayer() {
        document.getElementById("playerModal").style.display = "none";
        const nativePlayer = document.getElementById("nativePlayer");
        const ytPlayer = document.getElementById("ytPlayer");
        nativePlayer.pause();
        nativePlayer.src = "";
        ytPlayer.src = "";
    }

    loadData();
</script>
</body>
</html>
