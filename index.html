<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#121212"/>
    <title>Epic Gift</title>

    <base href="https://epicgift.app/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
      
      /* "High load right now" xatolik oynasini majburiy yashirib, o'yinni ko'rsatish */
      div:has(> svg):has(h1), 
      div:has(h2:contains("High load")),
      div[class*="error"],
      div[class*="overload"] {
        /* Xatolik bloki paydo bo'lsa uni yopib qo'yadi */
      }
    </style>

    <!-- Tarmoq so'rovlarini to'liq aldash (Barcha API so'rovlariga 200 berish) -->
    <script>
      (function() {
        const fakeSuccess = {
          success: true,
          status: "ok",
          ok: true,
          code: 0,
          user: { id: 7691140042, balance: 100000, username: "demo_user" },
          data: { balance: 100000, user: { id: 7691140042 } },
          isOverloaded: false,
          maintenance: false
        };

        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          try {
            const res = await originalFetch.apply(this, args);
            if (res.status === 200) return res;
          } catch(e) {}
          return new Response(JSON.stringify(fakeSuccess), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          });
        };

        // DOM yuklanganda "High load right now" yozuvini topib o'chirib tashlaydigan skript
        const observer = new MutationObserver(() => {
          const allElements = document.querySelectorAll('h1, h2, div, p');
          for (let el of allElements) {
            if (el.textContent && el.textContent.includes('High load right now')) {
              // Xatolik oynasining butun ota blokini yashiramiz
              let parent = el.closest('div');
              while (parent && parent.parentElement && parent.parentElement.id !== 'root') {
                parent = parent.parentElement;
              }
              if (parent && parent.id !== 'root') {
                parent.style.display = 'none';
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-hub-bg.webp" fetchpriority="high"/>
    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-card-upgrade.webp?v=5" fetchpriority="high"/>
    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-card-plinko.webp?v=5" fetchpriority="high"/>
    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-card-mines.webp?v=3" fetchpriority="high"/>

    <script type="module" crossorigin src="https://not1pmg-cell.github.io/epicdemo/main-Cz7lpHCh.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
