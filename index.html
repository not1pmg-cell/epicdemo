<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Uzs TV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root {
  --a: #4f8cff;
  --r: 12px;
  --font: -apple-system, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme=dark] {
  --bg: #0c0d10; --s: #14161b; --c: #1a1d23; --c2: #23262e;
  --t: #eceef2; --m: #8b909c; --b: #262a33;
}
:root[data-theme=black] {
  --bg: #000; --s: #0a0a0c; --c: #121316; --c2: #1c1d22;
  --t: #fff; --m: #888c96; --b: #202127;
}
:root[data-theme=light] {
  --bg: #f4f5f8; --s: #fff; --c: #fff; --c2: #eceef3;
  --t: #14161c; --m: #6b7180; --b: #dfe2ea;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--t);
  font-family: var(--font);
  font-size: 14px;
  min-height: 100vh;
  padding-bottom: calc(66px + env(safe-area-inset-bottom));
  -webkit-user-select: none;
  user-select: none;
}
button, select, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.f { fill: currentColor; stroke: none; }
.i.s { width: 16px; height: 16px; }
header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--b);
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; letter-spacing: -.3px; }
.logo b { width: 24px; height: 24px; border-radius: 7px; background: var(--a); display: grid; place-items: center; color: #fff; }
.logo b .i { width: 12px; height: 12px; }
.hb { display: flex; gap: 4px; }
.ib {
  background: none; border: none; width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center; color: var(--t);
}
.ib:active { background: var(--c2); }
.ib.on { color: var(--a); }
#view { max-width: 980px; margin: 0 auto; }
.wrap { padding: 0 16px; }
.seg {
  display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none;
  padding: 0 16px; border-bottom: 1px solid var(--b);
}
.seg::-webkit-scrollbar, .chips::-webkit-scrollbar, .hs::-webkit-scrollbar, .ctl::-webkit-scrollbar { display: none; }
.seg button {
  flex: none; background: none; border: none; padding: 12px 0; color: var(--m);
  font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.seg button.on { color: var(--t); border-color: var(--a); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 16px 2px; }
.chip {
  flex: none; background: var(--c); border: 1px solid var(--b); color: var(--m);
  padding: 6px 13px; border-radius: 18px; font-size: 12px; font-weight: 600;
}
.chip.on { background: var(--t); color: var(--bg); border-color: var(--t); }
.sec { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 10px; }
.sec h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
.sec a { color: var(--a); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 2px; }
.hero {
  display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; gap: 10px; margin: 14px -16px 0; padding: 0 16px;
}
.hero::-webkit-scrollbar { display: none; }
.slide {
  flex: none; width: 100%; scroll-snap-align: center; min-height: 210px;
  border-radius: 16px; position: relative; overflow: hidden; color: #fff;
  padding: 18px; display: flex; flex-direction: column; justify-content: flex-end;
  background-size: cover; background-position: center; cursor: pointer;
  border: 1px solid var(--b);
}
.slide::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,9,12,.92), rgba(8,9,12,.15) 75%); }
.slide > * { position: relative; }
.slide h3 { margin: 8px 0 2px; font-size: 24px; font-weight: 700; letter-spacing: -.5px; line-height: 1.15; }
.slide p { margin: 0; font-size: 12px; opacity: .7; }
.go {
  margin-top: 12px; align-self: flex-start; background: #fff; color: #000; border: none;
  border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
}
.go .i { width: 14px; height: 14px; }
.dots { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
.dots b { width: 5px; height: 5px; border-radius: 3px; background: var(--b); transition: .25s; }
.dots b.on { width: 16px; background: var(--t); }
.tag {
  display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
  background: rgba(0,0,0,.6); color: #fff; font-size: 10px; font-weight: 700;
  padding: 3px 7px; border-radius: 6px; letter-spacing: .3px;
}
.tag.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ff453a; animation: pl 1.4s infinite; }
@keyframes pl { 50% { opacity: .25; } }
.hs { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x proximity; }
.hs .card { flex: none; width: 150px; scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; }
.grid.list { grid-template-columns: 1fr; gap: 8px; }
.card { cursor: pointer; position: relative; }
.card:active .poster { transform: scale(.97); }
.poster {
  aspect-ratio: 16/10; border-radius: var(--r); position: relative; overflow: hidden;
  display: grid; place-items: center; color: #fff; background-size: cover; background-position: center;
  border: 1px solid var(--b); transition: transform .15s;
}
.poster .mono { font-size: 26px; font-weight: 700; letter-spacing: -1px; opacity: .88; }
.poster .tag { position: absolute; top: 7px; left: 7px; }
.poster .no { position: absolute; bottom: 6px; left: 8px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000a; }
.fav {
  position: absolute; top: 5px; right: 5px; z-index: 3; width: 28px; height: 28px;
  background: rgba(0,0,0,.45); border: none; border-radius: 50%; color: #fff;
  display: grid; place-items: center;
}
.fav .i { width: 15px; height: 15px; }
.fav.on { color: #ff453a; }
.fav.on .i { fill: currentColor; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.25); }
.bar i { display: block; height: 100%; background: var(--a); }
.cd { padding: 7px 2px 0; }
.cd .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd .m { font-size: 11px; color: var(--m); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid.list .card { display: flex; gap: 12px; align-items: center; background: var(--c); border: 1px solid var(--b); border-radius: var(--r); padding: 8px; }
.grid.list .poster { width: 110px; flex: none; }
.grid.list .cd { padding: 0; flex: 1; min-width: 0; }
.match {
  display: flex; align-items: center; gap: 12px; background: var(--c);
  border: 1px solid var(--b); border-radius: var(--r); padding: 10px; margin-bottom: 8px; cursor: pointer;
}
.match .poster { width: 76px; flex: none; aspect-ratio: 1; }
.match .mi { flex: 1; min-width: 0; }
.match .mt { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match .ms { font-size: 12px; color: var(--m); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.match .ms.on { color: #ff6259; font-weight: 600; }
.search { position: relative; margin: 14px 0 4px; display: flex; gap: 8px; }
.search label { position: relative; flex: 1; display: block; }
.search label .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--m); width: 18px; height: 18px; }
.search input {
  width: 100%; padding: 12px 12px 12px 38px; border-radius: 12px;
  border: 1px solid var(--b); background: var(--s); font-size: 15px; outline: none;
  -webkit-user-select: text; user-select: text;
}
.search input:focus { border-color: var(--a); }
.tools { display: flex; gap: 8px; margin: 12px 0 0; align-items: center; }
.sel { background: var(--s); border: 1px solid var(--b); padding: 8px 10px; border-radius: 10px; font-size: 12px; outline: none; flex: 1; }
.empty { text-align: center; color: var(--m); padding: 54px 20px; grid-column: 1/-1; }
.empty .i { width: 34px; height: 34px; margin-bottom: 8px; opacity: .6; }
.sk { aspect-ratio: 16/10; border-radius: var(--r); background: linear-gradient(90deg, var(--c) 25%, var(--c2) 50%, var(--c) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; display: flex;
  background: color-mix(in srgb, var(--s) 90%, transparent); backdrop-filter: blur(22px);
  border-top: 1px solid var(--b); padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
}
nav button {
  flex: 1; background: none; border: none; color: var(--m); font-size: 10px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0;
}
nav button.on { color: var(--a); }
.list-g { background: var(--c); border: 1px solid var(--b); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
.lr { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--b); }
.lr:last-child { border: none; }
.lr .i { color: var(--m); }
.lr .lt { flex: 1; font-size: 14px; }
.lr .lv { color: var(--m); font-size: 13px; }
.lr.link { cursor: pointer; }
.lr.link:active { background: var(--c2); }
.sw { width: 44px; height: 26px; border-radius: 13px; border: none; background: var(--c2); position: relative; transition: .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
.sw.on { background: #34c759; }
.sw.on::after { left: 21px; }
.dotsw { display: flex; gap: 10px; }
.dotsw i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--b); cursor: pointer; }
.dotsw i.on { border-color: var(--bg); outline: 2px solid var(--t); }
.who { display: flex; align-items: center; gap: 14px; padding: 18px 16px 6px; }
.av { width: 56px; height: 56px; border-radius: 50%; background: var(--c2) center/cover; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
.who h3 { margin: 0; font-size: 18px; }
.who p { margin: 3px 0 0; font-size: 12px; color: var(--m); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding: 14px; }
.stats b { display: block; font-size: 20px; }
.stats span { font-size: 11px; color: var(--m); }
.btn { display: block; width: 100%; background: var(--a); color: #fff; border: none; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 14px; margin-top: 10px; }
.btn.g { background: var(--c2); color: var(--t); }
.player { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none; flex-direction: column; overflow-y: auto; }
.player.open { display: flex; }
.ptop {
  display: flex; align-items: center; gap: 6px; padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
  position: sticky; top: 0; z-index: 5; background: var(--s); border-bottom: 1px solid var(--b);
}
.ptop h3 { margin: 0; flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbox { max-width: 980px; width: 100%; margin: 0 auto; }
.vbox { position: relative; width: 100%; aspect-ratio: 16/9; max-height: 58vh; background: #000; }
.vbox video, .vbox iframe { width: 100%; height: 100%; border: 0; background: #000; }
.vbox.aud video { opacity: 0; }
.vbox.aud::after { content: "Audio rejimi"; position: absolute; inset: 0; display: grid; place-items: center; color: #888; pointer-events: none; }
.vover {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; background: rgba(0,0,0,.74); color: #fff; text-align: center; padding: 16px; font-size: 13px;
}
.vover.show { display: flex; }
.vover button { background: #fff; color: #000; border: none; border-radius: 8px; padding: 8px 18px; font-weight: 700; }
.osd { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.65); color: #fff; font-size: 26px; font-weight: 700; padding: 4px 12px; border-radius: 8px; display: none; }
.seek { position: absolute; top: 0; bottom: 0; width: 30%; display: none; align-items: center; justify-content: center; color: #fff; background: rgba(255,255,255,.1); pointer-events: none; font-weight: 700; }
.spin { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.ctl { display: flex; gap: 2px; padding: 10px 8px 2px; overflow-x: auto; scrollbar-width: none; }
.ctl button {
  flex: none; background: none; border: none; width: 58px; padding: 6px 0; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--t); font-size: 10px;
}
.ctl button span { color: var(--m); }
.ctl button.on { color: var(--a); }
.ctl button.on span { color: var(--a); }
.ctl button:active { background: var(--c2); }
.info { padding: 10px 16px 0; }
.info h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { display: flex; align-items: center; gap: 5px; background: var(--c); border: 1px solid var(--b); color: var(--m); font-size: 12px; padding: 4px 9px; border-radius: 8px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.row:active { background: var(--c2); }
.row.cur { background: var(--c); border-color: var(--b); }
.row .th { width: 56px; height: 38px; border-radius: 8px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background-size: cover; background-position: center; }
.row .nn { width: 22px; color: var(--m); font-size: 12px; text-align: right; flex: none; }
.row .tt { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { color: var(--m); display: block; font-weight: 400; margin-top: 2px; }
#sheet { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; }
#sheet.open { display: flex; }
#sheetBox { background: var(--s); border-radius: 18px 18px 0 0; padding: 20px; width: 100%; max-width: 480px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
#sheetBox h3 { margin: 0 0 4px; }
#sheetBox p { margin: 0 0 14px; color: var(--m); font-size: 13px; }
#sheetBox input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--b); background: var(--c); font-size: 22px; text-align: center; letter-spacing: 8px; outline: none; -webkit-user-select: text; user-select: text; }
.toast {
  position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px);
  background: var(--t); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 999; max-width: 88%; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#splash { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: grid; place-items: center; transition: opacity .35s; }
#splash .logo { font-size: 28px; }
#splash .logo b { width: 40px; height: 40px; border-radius: 11px; }
#splash .logo b .i { width: 18px; height: 18px; }
:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.mbtn{position:absolute;top:6px;left:6px;z-index:6;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;display:none;place-items:center}
#miniX{left:auto;right:6px}
.skip{position:absolute;right:12px;bottom:46px;z-index:6;display:none;background:rgba(255,255,255,.92);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px}
.player.min{inset:auto 10px calc(74px + env(safe-area-inset-bottom)) auto;width:230px;height:auto;overflow:visible;background:none;z-index:150;box-shadow:0 8px 28px rgba(0,0,0,.55);border-radius:10px}
.player.min .pbox>:not(.vbox),.player.min .ptop{display:none}
.player.min .vbox{border-radius:10px;overflow:hidden;max-height:none}
.player.min .mbtn{display:grid}
.tms{gap:10px}
.tm{flex:none;width:292px;min-height:152px;border-radius:16px;position:relative;overflow:hidden;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background-size:cover;background-position:center;border:1px solid var(--b);cursor:pointer;scroll-snap-align:start}
.tm::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,12,.92),rgba(8,9,12,.55))}
.tm>*{position:relative}
.tl{font-size:11px;opacity:.75;font-weight:600}
.tvs{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tt2{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;text-align:center;font-size:12px;font-weight:600}
.mid{text-align:center}
.mid b{display:block;font-size:22px;font-weight:700}
.mid em{display:block;font-style:normal;font-size:11px;opacity:.75;margin-top:2px}
.mid em.lv2{color:#ff6259;opacity:1;font-weight:700}
.lg{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14) center/contain no-repeat;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;flex:none}
.lgs{display:flex;flex:none}
.lgs .lg{width:36px;height:36px;font-size:11px;background-color:var(--c2);border:2px solid var(--c)}
.lgs .lg+.lg{margin-left:-10px}
.rk{flex:none;display:flex;align-items:flex-end;cursor:pointer;scroll-snap-align:start}
.rk b{font-size:70px;font-weight:800;line-height:.78;color:transparent;-webkit-text-stroke:2px var(--m);margin-right:-14px;z-index:1}
.rk .poster{width:104px;aspect-ratio:4/5}
.notice{display:flex;align-items:center;gap:10px;background:var(--c);border:1px solid var(--b);border-left:3px solid var(--a);border-radius:10px;padding:8px 8px 8px 12px;margin-top:12px}
.notice .nt{flex:1;font-size:13px}
.desc{color:var(--m);font-size:13px;line-height:1.5;margin:10px 0 0}
#maint{position:fixed;inset:0;z-index:998;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
#maint .i{width:44px;height:44px;color:var(--m)}
#onb{position:fixed;inset:0;z-index:997;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center;gap:14px}
#onb .oi{width:84px;height:84px;border-radius:24px;background:var(--c);border:1px solid var(--b);display:grid;place-items:center;color:var(--a)}
#onb .oi .i{width:38px;height:38px}
#onb h2{margin:6px 0 0;font-size:24px;letter-spacing:-.4px}
#onb p{margin:0;color:var(--m);max-width:300px;line-height:1.5}
#onb .btn{max-width:320px}
#sheetBox textarea{width:100%;min-height:90px;padding:12px;border-radius:12px;border:1px solid var(--b);background:var(--c);font-size:15px;outline:none;resize:none;-webkit-user-select:text;user-select:text}
.meta span[data-team]{cursor:pointer}
</style>
</head>

  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>

  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></symbol>

/* ================= MA'LUMOT ================= */
async function loadData(force) {
  loading = true;
  if (!items.length) render();
  let ok = false;
  if (API_URL && tg && tg.initData) {
    try {
      const r = await fetch(API_URL.replace(/\/$/, "") + "/api/items", { headers: { "X-Init-Data": tg.initData } });

        const d = await r.json();
        items = d.items || [];
        meta.bot = d.bot || meta.bot;
        notice = d.notice || null;
        maint = d.maintenance || null;
        ok = true;
      } else if (r.status === 403) {
        document.body.innerHTML = '<div class="empty">Access denied</div>';
        return;
      }
    } catch (e) {}
  }
  if (!ok) {
    try {
      const r = await fetch(DATA_URL + (force ? "?t=" + Date.now() : ""), { cache: "no-store" });
      const d = await r.json();
      items = d.items || [];
      if (d.bot) meta.bot = d.bot;
      notice = d.notice || null;
      maint = d.maintenance || null;
      ok = true;
    } catch (e) {}
  }
  if (ok) ls.set("uzstv_cache", { items, meta });
  else {
    const c = ls.get("uzstv_cache", null);
    if (c) { items = c.items; meta = c.meta || meta; toast(T("offline")); }
  }
  setLib();
  loading = false;
  render();

function filt(a) {
  a = a.slice();
  if (genre !== "all") a = a.filter(x => (x.genre || "").toLowerCase() === genre.toLowerCase());
  if (lang2 !== "all") a = a.filter(x => String(x.language || "").toLowerCase() === lang2);
  if (query) {
    const q = query.toLowerCase();
    a = a.filter(x => [x.title, x.genre, x.badge].some(v => String(v || "").toLowerCase().includes(q)));
  }
  if (sortBy === "views") a.sort((x, y) => (y.views || 0) - (x.views || 0));
  else if (sortBy === "alpha") a.sort((x, y) => String(x.title).localeCompare(String(y.title)));
  else if (sortBy === "new") a.sort((x, y) => (y.id || 0) - (x.id || 0));
  return a;
}

  const m = /^(\d{1,2}):(\d{2})$/.exec(String(s).trim());
  if (m) {
    const d = new Date();
    d.setHours(+m[1], +m[2], 0, 0);
    return d.getTime();
  }
  const t = Date.parse(s);
  return isNaN(t) ? null : t;
}
function matchState(it) {
  const t = parseWhen(it.match_time);
  if (!t) return { k: "na", label: it.match_time || "" };
  const diff = t - Date.now();
  if (diff > 0) {
    const m = Math.ceil(diff / 60000);
    const txt = m >= 60 ? Math.floor(m / 60) + " " + T("h") + " " + (m % 60) + " " + T("min") : m + " " + T("min");
    return { k: "soon", label: T("starts") + " " + txt, t };
  }
  if (diff > -3 * 3600e3) return { k: "live", label: T("live"), t };
  return { k: "end", label: T("ended"), t };
}
function checkReminders() {
  const ids = new Set(rem);
  items.forEach(x => { if (x.content_type === "football" && teamsOf(x).some(n => teams.has(n))) ids.add(x.id); });
  ids.forEach(id => {
    const it = items.find(x => x.id === id);
    if (!it) return;
    const t = parseWhen(it.match_time);
    if (!t) return;
    const d = t - Date.now();
    if (d > 0 && d < 5 * 60000 && !noted[id]) {
      noted[id] = 1;
      const msg = it.title + " " + T("remMsg");
      try { tg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      if (tg && tg.showPopup) {
        tg.showPopup({ message: msg, buttons: [{ id: "o", type: "default", text: T("watch") }, { type: "cancel" }] }, b => { if (b === "o") openPlayer(id); });
      } else toast(msg);
    }
  });
}
function toggleRem(id) {
  if (rem.has(id)) { rem.delete(id); toast(T("remOff")); }
  else { rem.add(id); toast(T("remOn")); }
  ls.set("uzstv_rem", [...rem]);
  hap();
}

function epgNow(it) {
  if (it.epg && it.epg.length) {
    const n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
    const l = it.epg.map(e => {
      const m = /^(\d{1,2}):(\d{2})/.exec(e.t || e.time || "");
      return m ? { m: +m[1] * 60 + +m[2], title: e.title || e.name, t: e.t || e.time } : null;
    }).filter(Boolean).sort((a, b) => a.m - b.m);
    let i = -1;
    l.forEach((e, k) => { if (e.m <= nm) i = k; });
    return { now: i >= 0 ? l[i] : null, next: l[i + 1] || null };
  }
  return { now: it.now ? { title: it.now } : null, next: it.next ? { title: it.next } : null };
}
function isToday(it) {
  const t = parseWhen(it.match_time);
  if (t == null) return !!it.today;
  return new Date(t).toDateString() === new Date().toDateString();
}
function teamsOf(it) {
  if (it.home && it.away) return [it.home, it.away];
  const m = String(it.title).split(/\s+(?:vs|VS|v|-|–|—)\s+/);
  return m.length > 1 ? [m[0], m[1]] : [it.title, ""];
}

}
function todayCard(it) {

  const hm = t ? new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "vs";
  const mid = st.k === "live"
    ? `<b>${esc(it.score || "–")}</b><em class="lv2">${it.minute ? esc(it.minute) + "'" : T("live")}</em>`
    : `<b>${hm}</b><em>${st.k === "soon" ? esc(st.label.replace(T("starts") + " ", "")) : ""}</em>`;
  return `<div class="tm" data-open="${it.id}" style="${bgOf(it)}">
    <div class="tl">${esc(it.league || it.genre || "")}</div>
    <div class="tvs"><div class="tt2">${logo(it.home_logo, tm[0])}<span>${esc(tm[0])}</span></div>
      <div class="mid">${mid}</div>
      <div class="tt2">${logo(it.away_logo, tm[1])}<span>${esc(tm[1])}</span></div></div></div>`;
}

function card(it) {

  const tag = it.status === "down" ? T("down") : (it.badge || (isLive(it) ? T("live") : (isNew ? T("newb") : "")));
  const ep0 = it.content_type === "tv" ? epgNow(it) : null;

function closeSheet() { $("#sheet").classList.remove("open"); }
function pinSheet(mode) {

/* ================= PLEYER ================= */
const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
const SLEEPS = [0, 15, 30, 60];
const setOver = h => { const o = $("#vover"); o.innerHTML = h || ""; o.classList.toggle("show", !!h); };
function osd(t) {
  const o = $("#osd");
  o.textContent = t;
  o.style.display = "block";
  clearTimeout(osd._t);
  osd._t = setTimeout(() => o.style.display = "none", 1400);
}

function seasonsOf(it) {
  if (it.seasons && it.seasons.length) return it.seasons;
  if (it.episodes && it.episodes.length) return [{ name: "1", episodes: it.episodes }];
  return null;
}
function curEp() {
  const ss = cur && seasonsOf(cur);
  return ss ? ss[seasonI].episodes[epI] : null;
}
function epKey() { return cur.id + ":" + seasonI + ":" + epI; }
function openPlayer(id, s, e) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  if (cur && cur.id !== id) prevId = cur.id;
  cur = it; retries = 0; speedI = 0; srcI = 0; audioOn = false; subI = -1;
  const ss = seasonsOf(it);
  if (ss) {
    const le = lastEp[id] || { s: 0, e: 0 };
    seasonI = s != null ? s : le.s;
    epI = e != null ? e : le.e;
    if (!ss[seasonI] || !ss[seasonI].episodes[epI]) { seasonI = 0; epI = 0; }
    lastEp[id] = { s: seasonI, e: epI };
    ls.set("uzstv_le", lastEp);
  }
  const src = curEp() || it;
  srcs = [src.url].concat(src.backups || src.urls || []).filter(Boolean);
  if (!srcs.length) srcs = [""];
  it.views = (it.views || 0) + 1;
  hist = [{ id, t: Date.now() }].concat(hist.filter(h => h.id !== id)).slice(0, 40);
  ls.set("uzstv_hist", hist);
  if (API_URL && tg && tg.initData) fetch(API_URL.replace(/\/$/, "") + "/api/view/" + id, { method: "POST", headers: { "X-Init-Data": tg.initData } }).catch(() => {});
  hap("medium");
  mini = false;
  $("#player").classList.remove("min");
  paint();
  $("#player").classList.add("open");
  $("#player").scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (tg) tg.BackButton.show();
  mediaSession();
  play(srcs[0]);
}
function minimize() {
  if (!cur) return;
  mini = true;
  $("#player").classList.add("min");
  document.body.style.overflow = "";
  if (tg) tg.BackButton.hide();
  render();
}
function expand() {
  mini = false;
  $("#player").classList.remove("min");
  document.body.style.overflow = "hidden";
  if (tg) tg.BackButton.show();
}
function markWatched() {
  if (!cur) return;
  watched[seasonsOf(cur) ? epKey() : cur.id] = 1;
  ls.set("uzstv_w", watched);
}
function nextEp() {
  const ss = cur && seasonsOf(cur);
  if (!ss) return false;
  let sn = seasonI, en = epI + 1;
  if (en >= ss[sn].episodes.length) { sn++; en = 0; }
  if (!ss[sn]) return false;
  openPlayer(cur.id, sn, en);
  return true;
}

function paint() {
  const it = cur, live = isLive(it), ss = seasonsOf(it), ep = curEp();
  const subs = (ep && ep.subs) || it.subs || [];
  $("#pTitle").textContent = it.title + (ep ? " · " + (ep.title || (epI + 1)) : "");
  $("#iTitle").textContent = it.title;
  $("#skipI").textContent = T("skip");
  const b = (id, icon, label, on) => `<button id="${id}" class="${on ? "on" : ""}">${ic(icon)}<span>${label}</span></button>`;
  $("#ctl").innerHTML =
    b("cPrev", "prev", T("prev")) + b("cNext", "next", T("next")) +
    (live && prevId ? b("cLast", "back", T("last")) : "") +
    b("cFav", "heart", T("fav"), favs.has(it.id)) +
    (live ? b("cNum", "hash", T("channel")) : b("cSpeed", "gauge", SPEEDS[speedI] + "x")) +
    (it.content_type === "football" ? b("cRem", "bell", T("rems"), rem.has(it.id)) : "") +
    (subs.length ? b("cSub", "subs", subI >= 0 ? (subs[subI].label || subs[subI].lang) : T("subs"), subI >= 0) : "") +
    b("cSleep", "timer", sleepI ? SLEEPS[sleepI] + " " + T("min") : T("sleep"), sleepI) +
    (live ? b("cAud", "audio", T("audio"), audioOn) : "") +
    b("cCast", "cast", T("cast")) + b("cPip", "pip", "PiP") + b("cShare", "share", T("share")) +
    b("cRep", "flag", T("report")) + b("cFs", "full", T("full")) +
    `<select class="sel" id="cQual" style="display:none;flex:none;width:96px;margin:6px 4px"></select>`;
  const st = it.content_type === "football" ? matchState(it).label : "";
  const tm = it.content_type === "football" ? teamsOf(it).filter(Boolean) : [];
  $("#iMeta").innerHTML = [
    it.badge ? `<span>${esc(it.badge)}</span>` : "",
    it.status ? `<span>${esc(it.status === "down" ? T("down") : "OK")}</span>` : "",
    it.genre ? `<span>${esc(it.genre)}</span>` : "",
    it.language ? `<span>${ic("globe", "s")}${esc(String(it.language).toUpperCase())}</span>` : "",
    `<span>${ic("eye", "s")}${it.views || 0}</span>`,
    st ? `<span>${ic("clock", "s")}${esc(st)}</span>` : "",
    it.score ? `<span>${esc(it.score)}</span>` : "",
    it.content_type === "tv" ? `<span>${ic("hash", "s")}${channelNo(it)}</span>` : "",
    tm.length > 1 ? tm.map(n => `<span data-team="${esc(n)}" style="${teams.has(n) ? "color:var(--a);border-color:var(--a)" : ""}">${ic("star", "s")}${esc(n)}</span>`).join("") : ""
  ].join("");
  let d = "";
  if (it.desc) d += `<p class="desc">${esc(it.desc)}</p>`;
  const facts = [it.year, it.duration, it.country].filter(Boolean);
  if (facts.length) d += `<div class="meta" style="margin-top:8px">${facts.map(f => `<span>${esc(f)}</span>`).join("")}</div>`;
  if (it.cast && it.cast.length) d += `<div class="meta" style="margin-top:8px">${it.cast.map(c => `<span>${esc(c)}</span>`).join("")}</div>`;
  if (it.trailer) d += `<button class="btn g" data-act="trailer">${T("trailer")}</button>`;
  if (it.epg && it.epg.length) {
    const e = epgNow(it);
    d += `<div class="sec"><h2>${T("epg")}</h2></div><div class="list-g">${it.epg.map(x =>
      `<div class="lr" ${e.now && (x.title || x.name) === e.now.title ? 'style="color:var(--a)"' : ""}><div class="lv" style="width:48px">${esc(x.t || x.time)}</div><div class="lt">${esc(x.title || x.name)}</div></div>`).join("")}</div>`;
  }
  if (hls && hls.levels && hls.levels.length > 1) {
    const q = $("#cQual");
    q.innerHTML = `<option value="-1">${T("quality")}: ${T("auto")}</option>` + hls.levels.map((l, i) => `<option value="${i}" ${hls.currentLevel === i ? "selected" : ""}>${l.height ? l.height + "p" : Math.round(l.bitrate / 1000) + "k"}</option>`).join("");
    q.style.display = "";
  }
  $("#detail").innerHTML = d;
  if (ss) {
    $("#simT").textContent = T("episodes");
    $("#simRow").innerHTML = (ss.length > 1 ? `<div class="chips" style="padding:0 0 8px">${ss.map((x, i) =>
      `<button class="chip ${i === seasonI ? "on" : ""}" data-season="${i}">${esc(x.name || i + 1)}</button>`).join("")}</div>` : "") +
      ss[seasonI].episodes.map((x, i) =>
        `<div class="row ${i === epI ? "cur" : ""}" data-ep="${i}"><div class="nn">${i + 1}</div>
        <div class="tt">${esc(x.title || ("#" + (i + 1)))}<small>${esc(x.duration || "")}</small></div>
        ${watched[it.id + ":" + seasonI + ":" + i] ? ic("check", "s") : ""}${i === epI ? ic("play", "s f") : ""}</div>`).join("");
  } else {
    $("#simT").textContent = T("similar");
    $("#simRow").innerHTML = lib.filter(x => x.content_type === it.content_type).map((x, i) =>
      `<div class="row ${x.id === it.id ? "cur" : ""}" data-open="${x.id}"><div class="nn">${i + 1}</div>
        <div class="th" style="${bgOf(x)}">${x.poster ? "" : esc(mono(x.title))}</div>
        <div class="tt">${esc(x.title)}<small>${esc(x.genre || "")}</small></div>${x.id === it.id ? ic("play", "s f") : ""}</div>`).join("");
  }
}

function destroy() {
  clearTimeout(stallT);
  if (hls) { hls.destroy(); hls = null; }
  const v = $("#vbox video, #vbox iframe");
  if (v) {
    try { v.pause && v.pause(); v.removeAttribute && v.removeAttribute("src"); v.load && v.load(); } catch (e) {}
    v.remove();
  }
}

function play(url) {
  destroy();
  setOver('<div class="spin"></div>');
  $("#vbox").classList.toggle("aud", audioOn);
  if (location.protocol === "https:" && url.startsWith("http://")) url = "https://" + url.slice(7);
  const box = $("#vbox");
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);
  if (yt) {
    const f = document.createElement("iframe");
    f.src = "https://www.youtube.com/embed/" + yt[1] + "?autoplay=1&playsinline=1";
    f.allow = "autoplay; fullscreen; picture-in-picture";
    f.allowFullscreen = true;
    box.prepend(f);
    setOver("");
    return;
  }
  const video = document.createElement("video");
  video.controls = true; video.autoplay = true; video.playsInline = true;
  video.setAttribute("playsinline", "");
  box.prepend(video);
  const id = cur.id, pk = cur.id + (seasonsOf(cur) ? ":" + seasonI + ":" + epI : "");
  let last = 0;
  video.addEventListener("playing", () => { setOver(""); clearTimeout(stallT); });
  video.addEventListener("waiting", () => {
    setOver('<div class="spin"></div>');
    clearTimeout(stallT);
    if (isLive(cur)) stallT = setTimeout(() => { if (cur && cur.id === id) { toast(T("retry")); play(srcs[srcI]); } }, 14000);
  });
  video.addEventListener("error", fail);
  const sbs = ((curEp() && curEp().subs) || cur.subs || []);
  if (sbs.length) video.crossOrigin = "anonymous";
  sbs.forEach(x => {
    const tr = document.createElement("track");
    tr.kind = "subtitles"; tr.label = x.label || x.lang; tr.srclang = x.lang || "uz"; tr.src = x.url;
    video.appendChild(tr);
    tr.track.mode = "disabled";
  });
  video.addEventListener("timeupdate", () => {
    const iv = (curEp() && curEp().intro) || cur.intro, sk = $("#skipI");
    if (!sk) return;
    const on = iv && video.currentTime >= iv[0] && video.currentTime < iv[1];
    sk.style.display = on ? "block" : "none";
    sk.dataset.to = on ? iv[1] : "";
  });
  video.addEventListener("loadedmetadata", () => {
    if (!isLive(cur) && isFinite(video.duration)) {
      const p = prog[pk];
      if (p && p.t > 20 && p.t < video.duration - 20) video.currentTime = p.t;
      video.playbackRate = SPEEDS[speedI];
    }
  });
  video.addEventListener("timeupdate", () => {
    if (isLive(cur) || !isFinite(video.duration) || Date.now() - last < 4000) return;
    last = Date.now();
    prog[pk] = { t: video.currentTime, d: video.duration };
    ls.set("uzstv_prog", prog);
  });
  video.addEventListener("ended", () => {
    if (isLive(cur)) return;
    delete prog[pk];
    ls.set("uzstv_prog", prog);
    markWatched();
    if (S.autoNext && !nextEp()) step(1);
  });
  if (/\.m3u8/i.test(url)) {
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, maxBufferLength: S.saver ? 12 : 30, enableWorker: true, capLevelToPlayerSize: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => {
        video.play().catch(() => {});
        if (S.saver) {
          let cap = -1;
          d.levels.forEach((l, i) => { if (l.height && l.height <= 480) cap = Math.max(cap, i); });
          if (cap >= 0) hls.autoLevelCapping = cap;
        }
        const q = $("#cQual");
        if (d.levels.length > 1 && q) {
          q.innerHTML = `<option value="-1">${T("quality")}: ${T("auto")}</option>` +
            d.levels.map((l, i) => `<option value="${i}">${l.height ? l.height + "p" : Math.round(l.bitrate / 1000) + "k"}</option>`).join("");
          q.style.display = "";
        }
      });
      hls.on(Hls.Events.ERROR, (_, e) => {
        if (!e.fatal) return;
        if (e.type === Hls.ErrorTypes.NETWORK_ERROR && retries < 3) { retries++; setTimeout(() => hls && hls.startLoad(), 1200 * retries); }
        else if (e.type === Hls.ErrorTypes.MEDIA_ERROR && retries < 3) { retries++; hls.recoverMediaError(); }
        else fail();
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) { video.src = url; video.play().catch(() => {}); }
    else fail();
  } else { video.src = url; video.play().catch(() => {}); }
}

function fail() {
  if (srcI + 1 < srcs.length) { srcI++; retries = 0; toast("Zaxira manba " + (srcI + 1)); return play(srcs[srcI]); }
  setOver(`${ic("flag")}<div>${T("err")}</div><button id="vRetry">${T("retry")}</button>`);
}

function closePlayer() {
  destroy();
  cur = null;
  clearTimeout(sleepT);
  sleepI = 0;
  closeSheet();
  $("#player").classList.remove("open", "min");
  mini = false;
  document.body.style.overflow = "";
  if (tg) tg.BackButton.hide();
  render();
}

function step(dir) {
  if (!cur) return;
  const l = lib.filter(x => x.content_type === cur.content_type);
  if (!l.length) return;
  const i = Math.max(0, l.findIndex(x => x.id === cur.id));
  openPlayer(l[(i + dir + l.length) % l.length].id);
}
function goChannel(n) {
  if (!cur) return;
  const l = items.filter(x => x.content_type === cur.content_type);
  const it = l[n - 1];
  if (it) openPlayer(it.id); else toast(T("noCh"));
}
function toggleFav(id) {
  if (favs.has(id)) { favs.delete(id); toast(T("removed")); }
  else { favs.add(id); toast(T("added")); }
  ls.set("uzstv_favs", [...favs]);
  hap();
}
function cycleSleep() {
  sleepI = (sleepI + 1) % SLEEPS.length;
  clearTimeout(sleepT);
  const m = SLEEPS[sleepI];
  if (m) { toast(T("sleepOn") + ": " + m + " " + T("min")); sleepT = setTimeout(closePlayer, m * 60000); }
  else toast(T("sleepOff"));
  paint();
}
function seek(side) {
  const v = $("#vbox video");
  if (!v || !isFinite(v.duration) || isLive(cur)) return;
  v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + (side === "L" ? -10 : 10)));
  const e = $(side === "L" ? "#sL" : "#sR");
  e.style.display = "flex";
  setTimeout(() => e.style.display = "none", 450);
}
function shareLink(it) {
  return meta.bot ? `https://t.me/${meta.bot}?startapp=i${it.id}` : location.href;
}
function mediaSession() {
  if (!("mediaSession" in navigator) || !cur) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: cur.title, artist: "Uzs TV",
      artwork: cur.poster ? [{ src: cur.poster, sizes: "512x512" }] : []
    });
    navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
    navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
  } catch (e) {}
}

/* ================= HODISALAR ================= */
document.addEventListener("click", e => {
  const t = e.target;
  const mv = t.closest("[data-mv]");
  if (mv) {
    e.stopPropagation();
    const [id, dir] = mv.dataset.mv.split(":").map(Number);
    const arr = [...favs], i = arr.indexOf(id), j = i + dir;
    if (i >= 0 && j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; favs = new Set(arr); ls.set("uzstv_favs", arr); render(); }
    return;
  }
  const ep = t.closest("[data-ep]");
  if (ep && cur) return openPlayer(cur.id, seasonI, +ep.dataset.ep);
  const se = t.closest("[data-season]");
  if (se && cur) return openPlayer(cur.id, +se.dataset.season, 0);
  const tmb = t.closest("[data-team]");
  if (tmb) {
    const n = tmb.dataset.team;
    if (teams.has(n)) { teams.delete(n); toast(T("unfollow")); } else { teams.add(n); toast(T("follow")); }
    ls.set("uzstv_teams", [...teams]);
    return paint();
  }
  const ut = t.closest("[data-unteam]");
  if (ut) { teams.delete(ut.dataset.unteam); ls.set("uzstv_teams", [...teams]); toast(T("unfollow")); closeSheet(); return render(); }
  const l2 = t.closest("[data-lang2]");
  if (l2) { lang2 = l2.dataset.lang2; return render(); }
}, true);
document.addEventListener("click", e => {
  const t = e.target;
  const fb = t.closest("[data-fav]");
  if (fb) {
    e.stopPropagation();
    const id = +fb.dataset.fav;
    toggleFav(id);
    fb.classList.toggle("on", favs.has(id));
    if (view === "favs") render();
    return;
  }
  const rb = t.closest("[data-rem]");
  if (rb) { e.stopPropagation(); toggleRem(+rb.dataset.rem); rb.classList.toggle("on", rem.has(+rb.dataset.rem)); return; }
  const op = t.closest("[data-open]");
  if (op) return openPlayer(+op.dataset.open);
  const nv = t.closest("[data-nav]");
  if (nv) {
    view = nv.dataset.nav;
    if (view !== "search") query = "";
    genre = "all"; sortBy = "default";
    if (view === "movies") sub = "all";
    lang2 = "all"; favEdit = false;
    hap();
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  const go = t.closest("[data-go]");
  if (go) { view = go.dataset.go; genre = "all"; render(); window.scrollTo({ top: 0 }); return; }
  const sb = t.closest("[data-sub]");
  if (sb) { sub = sb.dataset.sub; genre = "all"; return render(); }
  const g = t.closest("[data-genre]");
  if (g) { genre = g.dataset.genre; return render(); }
  const q = t.closest("[data-q]");
  if (q) { query = q.dataset.q; saveSearch(); return vSearch($("#view")); }
  const th = t.closest("[data-theme]");
  if (th) { document.documentElement.dataset.theme = th.dataset.theme; localStorage.setItem("uzstv_theme", th.dataset.theme); return render(); }
  const ac = t.closest("[data-acc]");
  if (ac) { accent = +ac.dataset.acc; ls.set("uzstv_acc", accent); applyAccent(); return render(); }
  const st = t.closest("[data-set]");
  if (st) {
    const k = st.dataset.set;
    if (k === "layout") { layout = layout === "grid" ? "list" : "grid"; ls.set("uzstv_layout", layout); return render(); }
    if (k === "kids") return pinSheet(S.kids ? "check" : "set");
    S[k] = !S[k];
    save();
    return render();
  }
  const ac2 = t.closest("[data-act]");
  if (ac2) {
    switch (ac2.dataset.act) {
      case "noticeX": { const tx = typeof notice === "string" ? notice : (notice && notice.text); ls.set("uzstv_nd", tx || ""); return render(); }
      case "favEdit": favEdit = !favEdit; return render();
      case "teams":
        sheet(`<h3>${T("teams")}</h3><p>${teams.size ? "" : T("noTeams")}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${[...teams].map(n => `<button class="chip" data-unteam="${esc(n)}">${esc(n)} ×</button>`).join("")}</div>`);
        return;
      case "request":
        sheet(`<h3>${T("request")}</h3><p></p><textarea id="reqIn" placeholder="${T("reqPh")}"></textarea><button class="btn" data-act="sendReq">${T("ok")}</button>`);
        return;
      case "sendReq": {
        const tx = ($("#reqIn").value || "").trim();
        if (!tx) return;
        closeSheet();
        if (API_URL && tg && tg.initData) {
          fetch(API_URL.replace(/\/$/, "") + "/api/request", { method: "POST", headers: { "X-Init-Data": tg.initData, "Content-Type": "application/json" }, body: JSON.stringify({ text: tx }) })
            .then(() => toast(T("reqSent"))).catch(() => toast(T("reqNo")));
        } else toast(T("reqNo"));
        return;
      }
      case "trailer": { const u = cur && cur.trailer; if (u) { if (tg && tg.openLink) tg.openLink(u); else window.open(u, "_blank"); } return; }
      case "onbNext": onbI++; return onb();
      case "onbDone": ls.set("uzstv_onb", true); $("#onb").style.display = "none"; return;
      case "lucky": { if (lib.length) openPlayer(lib[Math.floor(Math.random() * lib.length)].id); return; }
      case "layout": layout = layout === "grid" ? "list" : "grid"; ls.set("uzstv_layout", layout); return render();
      case "clearSh": sh = []; ls.set("uzstv_sh", sh); return results();
      case "clearHist": hist = []; prog = {}; ls.set("uzstv_hist", hist); ls.set("uzstv_prog", prog); toast(T("cleared")); return render();
      case "refresh": return loadData(true);
      case "lang": LANG = LANG === "uz" ? "ru" : "uz"; localStorage.setItem("uzstv_lang", LANG); return render();
      case "bot": return tg && tg.openTelegramLink("https://t.me/" + meta.bot);
      case "voice": return voice();
      case "goCh": { const n = +($("#chIn").value || 0); closeSheet(); if (n) goChannel(n); return; }
      case "pin": {
        const val = $("#pinIn").value;
        if (val.length !== 4) return;
        if (ac2.dataset.mode === "set") { S.pin = val; S.kids = true; }
        else if (val === S.pin) S.kids = false;
        else { toast(T("pinBad")); return; }
        save(); setLib(); closeSheet(); return render();
      }
    }
  }
  if (t.id === "sheet") return closeSheet();
  const b = t.closest("#ctl button, #pClose, #vRetry, #miniE, #miniX, #skipI");
  if (!b) return;
  switch (b.id) {
    case "pClose": return minimize();
    case "miniE": return expand();
    case "miniX": return closePlayer();
    case "skipI": { const v = $("#vbox video"); if (v && b.dataset.to) v.currentTime = +b.dataset.to; return; }
    case "cLast": if (prevId) openPlayer(prevId); return;
    case "cSub": {
      const v = $("#vbox video");
      if (!v) return;
      const tt = [...v.textTracks];
      subI = subI + 1 >= tt.length ? -1 : subI + 1;
      tt.forEach((x, i) => x.mode = i === subI ? "showing" : "disabled");
      return paint();
    }
    case "cCast": {
      const v = $("#vbox video");
      if (v && v.remote && v.remote.prompt) v.remote.prompt().catch(() => {});
      else if (v && v.webkitShowPlaybackTargetPicker) v.webkitShowPlaybackTargetPicker();
      else toast(T("castNo"));
      return;
    }
    case "cPrev": return step(-1);
    case "cNext": return nextEp() || step(1);
    case "cFav": toggleFav(cur.id); return paint();
    case "cRem": toggleRem(cur.id); return paint();
    case "cNum": return chSheet();
    case "cSleep": return cycleSleep();
    case "cSpeed": {
      speedI = (speedI + 1) % SPEEDS.length;
      const v = $("#vbox video");
      if (v) v.playbackRate = SPEEDS[speedI];
      return paint();
    }
    case "cAud": audioOn = !audioOn; $("#vbox").classList.toggle("aud", audioOn); return paint();
    case "cRep":
      if (API_URL && tg && tg.initData) fetch(API_URL.replace(/\/$/, "") + "/api/report/" + cur.id, { method: "POST", headers: { "X-Init-Data": tg.initData } }).catch(() => {});
      return toast(T("reported"));
    case "cShare": {
      const link = shareLink(cur);
      const u = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(cur.title + " - Uzs TV");
      if (tg) tg.openTelegramLink(u);
      else { navigator.clipboard && navigator.clipboard.writeText(link); toast(T("copied")); }
      return;
    }
    case "cPip": {
      const v = $("#vbox video");
      if (v && document.pictureInPictureEnabled) v.requestPictureInPicture().catch(() => toast(T("pip")));
      else toast(T("pip"));
      return;
    }
    case "cFs": {
      const bx = $("#vbox"), v = $("#vbox video") || bx;
      if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
      else (bx.requestFullscreen || bx.webkitRequestFullscreen).call(bx).then(() => {
        try { screen.orientation.lock("landscape"); } catch (e) {}
      }).catch(() => {});
      return;
    }
    case "vRetry": retries = 0; srcI = 0; return play(srcs[0]);
  }
});

function voice() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return toast(T("voiceNo"));
  const r = new R();
  r.lang = LANG === "ru" ? "ru-RU" : "uz-UZ";
  r.onresult = e => { query = e.results[0][0].transcript; saveSearch(); vSearch($("#view")); };
  try { r.start(); } catch (e) {}
}

/* video ustida: ikki marta bosish va surish */
$("#vbox").addEventListener("dblclick", e => {
  const r = e.currentTarget.getBoundingClientRect();
  seek(e.clientX - r.left < r.width / 2 ? "L" : "R");
});
let tx = 0, ty = 0;
$("#vbox").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#vbox").addEventListener("touchend", e => {
  if (!S.swipe || !cur || !isLive(cur)) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 80 && Math.abs(dy) < 50) step(dx < 0 ? 1 : -1);
});

document.addEventListener("input", e => {
  if (e.target.id === "q") {
    query = e.target.value.trim();
    clearTimeout(window._qt);
    window._qt = setTimeout(results, 180);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { sortBy = e.target.value; render(); }
  if (e.target.id === "cQual" && hls) hls.currentLevel = +e.target.value;
});
document.addEventListener("keydown", e => {
  const typing = e.target.matches && e.target.matches("input,select");
  if (e.target.id === "q" && e.key === "Enter") { saveSearch(); e.target.blur(); }
  if (e.key === "Enter" && e.target.id === "chIn") { const n = +e.target.value; closeSheet(); if (n) goChannel(n); }
  if (e.key === "Escape") { if ($("#sheet").classList.contains("open")) closeSheet(); else if (cur && !mini) minimize(); else if (cur) closePlayer(); }
  if (!cur || typing) return;
  if (e.key === "ArrowRight") seek("R");
  else if (e.key === "ArrowLeft") seek("L");
  else if (e.key === "ArrowUp") step(-1);
  else if (e.key === "ArrowDown") step(1);
  else if (e.key === "f") $("#cFs") && $("#cFs").click();
  else if (/^\d$/.test(e.key) && isLive(cur)) {
    digits += e.key;
    osd(digits);
    clearTimeout(digitT);
    digitT = setTimeout(() => { const n = +digits; digits = ""; if (n === 0) { if (prevId) openPlayer(prevId); } else goChannel(n); }, 1300);
  }
});
if (tg) tg.BackButton.onClick(() => { if (cur && !mini) minimize(); else if (cur) closePlayer(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && cur && hls) hls.startLoad(); });
window.addEventListener("offline", () => toast(T("offline")));
window.addEventListener("online", () => loadData());

/* ================= BOSHLASH ================= */
document.documentElement.dataset.theme = localStorage.getItem("uzstv_theme") || (tg && tg.colorScheme === "light" ? "light" : "dark");
loadData().finally(() => {
  const s = $("#splash");
  if (s) { s.style.opacity = 0; setTimeout(() => s.remove(), 400); }
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const m = sp && /^i(\d+)$/.exec(sp);
  if (m) openPlayer(+m[1]);
  if (!ls.get("uzstv_onb", false)) onb();
});
setTimeout(() => { const s = $("#splash"); if (s) s.remove(); }, 8000);
setInterval(() => {
  const v = $("#vbox video");
  if (!cur || !v || v.paused || v.ended) return;
  const d = new Date().toISOString().slice(0, 10);
  wst.d[d] = (wst.d[d] || 0) + 5;
  if (cur.genre) wst.g[cur.genre] = (wst.g[cur.genre] || 0) + 5;
  ls.set("uzstv_wst", wst);
}, 5000);
setInterval(() => { if (!cur && !document.hidden && view !== "search") loadData(); }, 5 * 60 * 1000);
setInterval(() => { checkReminders(); if (!cur && view === "football") render(); }, 30000);
</script>
