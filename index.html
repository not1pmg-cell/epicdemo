<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Uzs TV — Bosh sahifa</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #f43f5e;
            --accent-hover: #e11d48;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: #1f293d;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #0e1422;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .user-profile {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .search-container {
            padding: 14px 20px;
            background-color: var(--bg-color);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
        }

        .categories-scroll {
            display: flex;
            gap: 10px;
            padding: 0 20px 14px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .section-title {
            padding: 0 20px;
            font-size: 17px;
            font-weight: 700;
            margin: 10px 0 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 0 20px 24px 20px;
            flex: 1;
        }

        @media (min-width: 600px) {
            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card-poster {
            height: 120px;
            background-color: #1e293b;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--success);
            font-weight: 600;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 1.5px infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Pleyer Modali */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0e1422;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
        }

        .close-btn {
            background-color: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }

        .player-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            position: relative;
        }

        video, iframe {
            width: 100%;
            max-height: 100vh;
            aspect-ratio: 16/9;
            border: none;
            outline: none;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">📺 Uzs TV</div>
    <div class="user-profile" id="userName">Foydalanuvchi</div>
</header>

<div class="search-container">
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Kanal, film yoki multfilm izlash...">
    </div>
</div>

<div class="categories-scroll" id="catContainer">
    <button class="cat-btn active" onclick="filterCat('all', this)">Barchasi</button>
    <button class="cat-btn" onclick="filterCat('Sport', this)">⚽ Sport</button>
    <button class="cat-btn" onclick="filterCat('TV', this)">📺 TV Kanallar</button>
    <button class="cat-btn" onclick="filterCat('Multfilm', this)">🧒 Multfilmlar</button>
    <button class="cat-btn" onclick="filterCat('Kino', this)">🎥 Kinolar</button>
</div>

<div class="section-title">
    <span>Ommabop kontentlar</span>
    <span id="itemCount" style="font-size: 13px; color: var(--text-secondary);">0 ta</span>
</div>

<div class="content-grid" id="grid">
    <!-- Kontentlar dinamik tarzda yuklanadi -->
</div>

<!-- Pleyer oynasi -->
<div class="modal" id="playerModal">
    <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Pleyer</h3>
        <button class="close-btn" onclick="closePlayer()">Yopish</button>
    </div>
    <div class="player-container">
        <video id="player" controls playsinline style="display:none;"></video>
        <iframe id="ytPlayer" allowfullscreen style="display:none;" allow="autoplay; encrypted-media"></iframe>
    </div>
</div>

<script>
    // Telegram WebApp ishga tushirish
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    // Foydalanuvchi nomini chiqarish
    if (Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
        const user = Telegram.WebApp.initDataUnsafe.user;
        document.getElementById('userName').textContent = user.first_name || "Foydalanuvchi";
    }

    // URL orqali kelgan parametrlarni o'qish
    const urlParams = new URLSearchParams(window.location.search);
    const directUrl = urlParams.get("url");
    const directTitle = urlParams.get("title");

    // Asosiy ma'lumotlar bazasi (Kanal va multfilmlar)
    const items = [
        {
            title: "Sport TV O'zbekiston",
            category: "Sport",
            badge: "Sport",
            url: "https://index.m3u8",
            poster: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500"
        },
        {
            title: "O'zbekiston 24",
            category: "TV",
            badge: "Yangiliklar",
            url: "https://index.m3u8",
            poster: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=500"
        },
        {
            title: "Sevimli TV",
            category: "TV",
            badge: "HD",
            url: "https://index.m3u8",
            poster: "https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?w=500"
        },
        {
            title: "Togrivoy va Egrivoy (Multfilm)",
            category: "Multfilm",
            badge: "Multfilm",
            url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            poster: "https://images.unsplash.com/photo-1560942446-b8a542969f56?w=500"
        },
        {
            title: "Muzqaymoq Multfilmi",
            category: "Multfilm",
            badge: "Multfilm",
            url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            poster: "https://images.unsplash.com/photo-1535223289827-42f1e9919769?w=500"
        }
    ];

    function renderItems(data) {
        const grid = document.getElementById("grid");
        const itemCount = document.getElementById("itemCount");
        grid.innerHTML = "";
        itemCount.textContent = `${data.length} ta`;

        if (data.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>Hech narsa topilmadi</h3>
                    <p>Boshqa so'z bilan qidirib ko'ring</p>
                </div>
            `;
            return;
        }

        data.forEach(item => {
            grid.innerHTML += `
                <div class="card" onclick="openPlayer('${item.title.replace(/'/g, "\\'")}', '${item.url}')">
                    <div class="card-poster" style="background-image: url('${item.poster}')">
                        <div class="badge">${item.badge}</div>
                    </div>
                    <div class="card-body">
                        <p class="card-title">${item.title}</p>
                        <div class="card-footer">
                            <span>${item.category}</span>
                            <div class="live-indicator">
                                <div class="live-dot"></div>
                                <span>HD</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (cat === 'all') {
            renderItems(items);
        } else {
            renderItems(items.filter(x => x.category === cat));
        }
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        renderItems(items.filter(x => x.title.toLowerCase().includes(q)));
    });

    function getYouTubeId(u) {
        const match = u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function openPlayer(title, url) {
        document.getElementById("modalTitle").textContent = title;
        const modal = document.getElementById("playerModal");
        const video = document.getElementById("player");
        const yt = document.getElementById("ytPlayer");
        modal.style.display = "flex";

        const ytId = getYouTubeId(url);
        if (ytId) {
            video.style.display = "none";
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        } else if (url.includes(".m3u8")) {
            yt.style.display = "none";
            video.style.display = "block";
            if (window.Hls && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
                video.play();
            }
        } else {
            yt.style.display = "none";
            video.style.display = "block";
            video.src = url;
            video.play();
        }
    }

    function closePlayer() {
        const modal = document.getElementById("playerModal");
        const video = document.getElementById("player");
        const yt = document.getElementById("ytPlayer");
        modal.style.display = "none";
        video.pause();
        video.src = "";
        yt.src = "";
    }

    // Agar bot orqali bevosita biron kanal havolasi bilan ochilgan bo'lsa
    if (directUrl) {
        openPlayer(directTitle || "Uzs TV", directUrl);
    } else {
        renderItems(items);
    }
</script>
</body>
</html>
