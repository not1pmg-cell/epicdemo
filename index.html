<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Uzs TV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--a:#7c5cff;--a2:#22d3ee;--r:18px}
:root[data-theme=dark]{--bg:#0a0c14;--s:#121624;--c:#181d30;--c2:#222942;--t:#f4f6fb;--m:#8d97b3;--b:#252c47;--sh:rgba(0,0,0,.5)}
:root[data-theme=black]{--bg:#000;--s:#0b0b10;--c:#13131a;--c2:#1e1e28;--t:#fff;--m:#8a8a99;--b:#222230;--sh:rgba(0,0,0,.6)}
:root[data-theme=light]{--bg:#eef1f7;--s:#fff;--c:#fff;--c2:#e6eaf3;--t:#0f1424;--m:#667089;--b:#d8deea;--sh:rgba(20,30,60,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--t);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;transition:background .25s}
button,select,input{font-family:inherit;color:inherit}
header{position:sticky;top:0;z-index:50;padding:10px 16px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px)}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.4px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;box-shadow:0 4px 16px color-mix(in srgb,var(--a) 55%,transparent)}
.ib{background:var(--c);border:1px solid var(--b);border-radius:12px;min-width:38px;height:38px;padding:0 11px;font-size:13px;font-weight:700;cursor:pointer;flex:none}
.ib:active{transform:scale(.93)}.ib.on{background:var(--a);border-color:var(--a);color:#fff}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0 10px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--c);border:1px solid var(--b);color:var(--m);padding:8px 15px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill.on{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--a) 40%,transparent)}
.pill.sm{padding:5px 12px;font-size:12px;font-weight:600}
.wrap{padding:0 16px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
.sec a{font-size:12px;color:var(--a2);font-weight:700;cursor:pointer}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;margin:4px -16px 0;padding:0 16px}
.hero::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;scroll-snap-align:center;min-height:200px;border-radius:24px;position:relative;overflow:hidden;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;cursor:pointer;box-shadow:0 14px 34px var(--sh)}
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,7,14,.92),rgba(5,7,14,.1) 70%)}
.slide>*{position:relative}
.slide h3{margin:8px 0 3px;font-size:25px;font-weight:900;letter-spacing:-.6px;line-height:1.1}
.slide p{margin:0;font-size:12px;opacity:.8}
.go{margin-top:12px;align-self:flex-start;background:#fff;color:#000;border:none;border-radius:22px;padding:9px 20px;font-weight:800;font-size:13px}
.dots{display:flex;justify-content:center;gap:5px;margin:9px 0 0}
.dots b{width:6px;height:6px;border-radius:3px;background:var(--b);transition:.25s}.dots b.on{width:20px;background:var(--a)}
.tag{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px}
.tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff3b4e;animation:p 1.3s infinite}
@keyframes p{50%{opacity:.25}}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity}
.hs::-webkit-scrollbar{display:none}
.hs .card{flex:none;width:148px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}.hs .card{width:170px}}
.grid.list{grid-template-columns:1fr}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);overflow:hidden;position:relative;cursor:pointer;box-shadow:0 6px 18px var(--sh);transition:transform .15s}
.card:active{transform:scale(.96)}
.poster{height:104px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;background-size:cover;background-position:center;padding:8px}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 65%)}
.poster>*{position:relative;z-index:1}
.poster .tag{position:absolute;top:7px;left:7px}
.poster .ic{font-size:30px}.poster .nm{font-size:12px;font-weight:800;text-align:center;text-shadow:0 1px 4px #0009;line-height:1.15}
.fav{position:absolute!important;top:5px;right:5px;z-index:3;background:rgba(0,0,0,.45);border:none;border-radius:50%;width:28px;height:28px;font-size:13px;cursor:pointer}
.bar{position:absolute!important;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);z-index:2}.bar i{display:block;height:100%;background:var(--a2)}
.cd{padding:9px 11px}.cd .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .m{display:flex;justify-content:space-between;font-size:11px;color:var(--m);margin-top:2px}
.grid.list .card{display:flex}.grid.list .poster{width:120px;height:auto;min-height:84px;flex:none}.grid.list .cd{flex:1;display:flex;flex-direction:column;justify-content:center}
.search{position:relative;margin:12px 0 4px}
.search input{width:100%;padding:14px 42px 14px 44px;border-radius:16px;border:1px solid var(--b);background:var(--s);font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
.search input:focus{border-color:var(--a)}.search span{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tools{display:flex;gap:8px;margin:8px 0}
.sel{background:var(--s);border:1px solid var(--b);padding:9px;border-radius:12px;font-size:12px;outline:none;flex:1}
.lucky{flex:2;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:none;border-radius:12px;font-weight:800;font-size:13px;padding:10px;cursor:pointer}
.empty{text-align:center;color:var(--m);padding:46px 20px;font-size:14px;grid-column:1/-1}.empty b{display:block;font-size:36px;margin-bottom:8px}
.sk{border-radius:var(--r);height:158px;background:linear-gradient(90deg,var(--c) 25%,var(--c2) 50%,var(--c) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:14px;right:14px;z-index:60;display:flex;background:color-mix(in srgb,var(--s) 90%,transparent);backdrop-filter:blur(20px);border:1px solid var(--b);border-radius:24px;padding:6px;box-shadow:0 10px 30px var(--sh);max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:none;color:var(--m);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;cursor:pointer}
nav button .e{font-size:19px}nav button.on{background:color-mix(in srgb,var(--a) 22%,transparent);color:var(--t)}
.player{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;overflow-y:auto}
.player.open{display:flex}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;z-index:5;background:var(--s);border-bottom:1px solid var(--b)}
.ptop h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbox{position:relative;width:100%;aspect-ratio:16/9;max-height:56vh;background:#000}
.vbox video,.vbox iframe{width:100%;height:100%;border:0;background:#000}
.vover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.72);color:#fff;text-align:center;padding:16px;font-size:13px}
.vover.show{display:flex}.vover button{background:var(--a);border:none;color:#fff;border-radius:18px;padding:8px 20px;font-weight:800;cursor:pointer}
.seek{position:absolute;top:0;bottom:0;width:30%;display:none;align-items:center;justify-content:center;font-size:22px;color:#fff;background:rgba(255,255,255,.12);pointer-events:none}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.ctrl{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}.ctrl .sel{flex:none}
.info{padding:8px 16px}.info h2{margin:0 0 8px;font-size:21px;font-weight:900;letter-spacing:-.4px}
.meta{display:flex;flex-wrap:wrap;gap:7px}.meta span{background:var(--c);border:1px solid var(--b);color:var(--m);font-size:12px;padding:4px 10px;border-radius:12px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:8px;cursor:pointer}
.row.cur{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--c))}
.row .th{width:54px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:20px;background-size:cover;background-position:center;color:#fff}
.row .tt{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--m);display:block;font-weight:500;margin-top:2px}
.pcard{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:16px;margin-bottom:12px}
.pcard h3{margin:0 0 10px;font-size:15px}.pcard p{margin:4px 0;font-size:13px;color:var(--m)}
.who{display:flex;align-items:center;gap:14px}.av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;background-size:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:var(--m)}
.sw{display:flex;gap:10px}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--t)}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:none;border-radius:14px;padding:13px;font-weight:800;font-size:14px;margin-top:8px;cursor:pointer}.btn.g{background:var(--c2);color:var(--t)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111d;color:#fff;backdrop-filter:blur(8px);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
#splash .logo{font-size:34px}#splash i{width:54px;height:54px;font-size:20px;border-radius:16px}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="logo"><i>▶</i>Uzs TV</div></div>
<header>
  <div class="top"><div class="logo"><i>▶</i>Uzs TV</div>
    <div style="display:flex;gap:6px"><button class="ib" id="bLucky">🎲</button><button class="ib" id="bLang">UZ</button><button class="ib" id="bTheme">🌓</button></div></div>
  <div class="pills" id="pills"></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-v="home"><span class="e">🏠</span><span data-i="home"></span></button>
  <button data-v="search"><span class="e">🔍</span><span data-i="search"></span></button>
  <button data-v="favs"><span class="e">❤️</span><span data-i="favs"></span></button>
  <button data-v="profile"><span class="e">👤</span><span data-i="profile"></span></button>
</nav>
<div class="player" id="player">
  <div class="ptop"><h3 id="pTitle"></h3><button class="ib on" id="pClose">✕</button></div>
  <div class="vbox" id="vbox"><div class="seek" id="sL" style="left:0">⏪ 10</div><div class="seek" id="sR" style="right:0">10 ⏩</div><div class="vover" id="vover"></div></div>
  <div class="ctrl">
    <button class="ib" id="cPrev">⏮</button><button class="ib" id="cNext">⏭</button><button class="ib" id="cFav">🤍</button><button class="ib" id="cShare">📤</button>
    <button class="ib" id="cPip">🖼</button><button class="ib" id="cSleep">⏱</button><button class="ib" id="cSpeed">1x</button><button class="ib" id="cRep">⚠️</button><button class="ib" id="cFs">⛶</button>
    <select class="sel" id="cQual" style="display:none"></select>
  </div>
  <div class="info"><h2 id="iTitle"></h2><div class="meta" id="iMeta"></div></div>
  <div class="wrap"><div class="sec"><h2 id="simT"></h2></div><div class="rows" id="simRow"></div></div>
  <div style="height:40px"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== SOZLAMALAR ===== */
const API_URL = "";            // bot API manzili, masalan "https://uzstv-bot.onrender.com" (bo'sh = faqat data.json)
const DATA_URL = "data.json";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("secondary_bg_color"); } catch(e){} }

/* ===== TILLAR [uz, ru] ===== */
const D={home:["Bosh","Главная"],search:["Qidiruv","Поиск"],favs:["Sevimli","Избранное"],profile:["Profil","Профиль"],all:["Hammasi","Все"],tv:["📺 TV","📺 ТВ"],football:["⚽ Futbol","⚽ Футбол"],movies:["🎬 Kino","🎬 Кино"],cartoons:["🧸 Multfilm","🧸 Мульты"],
ph:["Kanal, kino, janr...","Канал, фильм, жанр..."],live:["JONLI","LIVE"],recent:["🕘 Davom ettirish","🕘 Продолжить"],trend:["🔥 Trend","🔥 Тренд"],nowlive:["🔴 Hozir efirda","🔴 Сейчас в эфире"],more:["Hammasi ›","Все ›"],
none:["Hech narsa topilmadi","Ничего не найдено"],nofav:["Sevimlilar yo'q. Kartadagi 🤍 ni bosing.","Избранного нет. Нажмите 🤍 на карточке."],similar:["Shu turkumdan","Из этой категории"],
err:["Efir yuklanmadi","Эфир не загрузился"],retry:["Qayta urinish","Повторить"],added:["Sevimlilarga qo'shildi","Добавлено в избранное"],removed:["Sevimlilardan olindi","Удалено из избранного"],
copied:["Havola nusxalandi","Ссылка скопирована"],pip:["PiP qo'llab-quvvatlanmaydi","PiP не поддерживается"],offline:["Oflayn rejim (saqlangan ma'lumot)","Офлайн (сохранённые данные)"],
quality:["Sifat","Качество"],auto:["Avto","Авто"],sleep:["Uyqu taymeri","Таймер сна"],sleepOff:["Taymer o'chirildi","Таймер выключен"],reported:["Muammo haqida xabar berildi, rahmat!","Жалоба отправлена, спасибо!"],
genre:["Janr","Жанр"],views:["Ko'rishlar","Просмотры"],sort:["Tartib","Порядок"],pop:["🔥 Mashhur","🔥 Популярные"],az:["A–Z","А–Я"],newest:["🆕 Yangi","🆕 Новые"],
lucky:["🎲 Tasodifiy kanal","🎲 Случайный канал"],hist:["Oxirgi qidiruvlar","Недавние запросы"],clearS:["Tozalash","Очистить"],popular:["Ommabop","Популярное"],
stats:["Statistika","Статистика"],tot:["Jami","Всего"],watched:["Ko'rilgan","Просмотрено"],theme:["Mavzu","Тема"],accent:["Rang","Цвет"],lang:["Til","Язык"],
layout:["Ko'rinish","Вид"],clearH:["🗑 Tarixni tozalash","🗑 Очистить историю"],cleared:["Tozalandi","Очищено"],refresh:["🔄 Yangilash","🔄 Обновить"],bot:["🤖 Botga o'tish","🤖 Перейти в бота"],
free:["🆓 Bepul","🆓 Бесплатно"],match:["O'yin vaqti","Время матча"],autoNext:["Avto keyingisi","Авто-следующий"],on:["Yoqilgan","Вкл"],off:["O'chiq","Выкл"],close:["Yopish","Закрыть"]};
let LANG = localStorage.getItem("uzstv_lang") || ((tg && tg.initDataUnsafe?.user?.language_code === "ru") ? "ru" : "uz");
const T = k => (D[k] || [k,k])[LANG === "ru" ? 1 : 0];

/* ===== YORDAMCHILAR ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const hap = (t="light") => { try { tg && tg.HapticFeedback.impactOccurred(t); } catch(e){} };
const GR = [["#312e81","#0f172a"],["#7f1d1d","#0f172a"],["#14532d","#0f172a"],["#581c87","#0f172a"],["#9a3412","#0f172a"],["#134e4a","#0f172a"],["#831843","#0f172a"]];
const grad = t => { let h=0; for (const c of String(t)) h=(h*31+c.charCodeAt(0))>>>0; const g=GR[h%GR.length]; return `linear-gradient(135deg,${g[0]},${g[1]})`; };
const bgOf = it => it.poster ? `background-image:url('${esc(it.poster)}')` : `background:${grad(it.title)}`;
const ICON = {tv:"📺",football:"⚽",movies:"🎬",series:"🍿",cartoons:"🧸"};
const isLive = it => it.content_type === "tv" || it.content_type === "football";
const ACC = [["#7c5cff","#22d3ee"],["#ff3b5c","#ff9f43"],["#10b981","#a3e635"],["#3b82f6","#06b6d4"],["#ec4899","#8b5cf6"]];
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ===== HOLAT ===== */
let items=[], meta={bot:""}, loading=true;
let favs=new Set(ls.get("uzstv_favs",[])), hist=ls.get("uzstv_hist",[]), prog=ls.get("uzstv_prog",{}), sh=ls.get("uzstv_sh",[]);
let view="home", type="all", genre="all", sortBy="default", query="", layout=ls.get("uzstv_layout","grid"), autoNext=ls.get("uzstv_an",true), accent=ls.get("uzstv_acc",0);
let cur=null, hls=null, retries=0, sleepT=null, sleepI=0, speedI=0, heroT=null;

function applyAccent(){ const a=ACC[accent]||ACC[0]; document.documentElement.style.setProperty("--a",a[0]); document.documentElement.style.setProperty("--a2",a[1]); }
applyAccent();

/* ===== MA'LUMOT ===== */
async function loadData(force){
  loading=true; if(!items.length) render();
  let ok=false;
  if (API_URL && tg && tg.initData) {
    try { const r=await fetch(API_URL.replace(/\/$/,"")+"/api/items",{headers:{"X-Init-Data":tg.initData}});
      if (r.ok){ const d=await r.json(); items=d.items||[]; meta={bot:d.bot||meta.bot}; ok=true; }
      else if (r.status===403){ document.body.innerHTML='<div class="empty"><b>🚫</b>Access denied</div>'; return; } } catch(e){}
  }
  if (!ok) { try { const r=await fetch(DATA_URL+(force?"?t="+Date.now():""),{cache:"no-store"}); const d=await r.json(); items=d.items||[]; if(d.bot) meta.bot=d.bot; ok=true; } catch(e){} }
  if (ok) ls.set("uzstv_cache",{items,meta});
  else { const c=ls.get("uzstv_cache",null); if(c){ items=c.items; meta=c.meta||meta; toast(T("offline")); } }
  loading=false; render();
}

/* ===== FILTR ===== */
const byType = t => items.filter(x => x.content_type === t);
const top = a => a.slice().sort((x,y)=>(y.views||0)-(x.views||0));
function filt(a){
  a=a.slice();
  if (type!=="all") a=a.filter(x=>x.content_type===type);
  if (genre!=="all") a=a.filter(x=>(x.genre||"").toLowerCase()===genre.toLowerCase());
  if (query){ const q=query.toLowerCase(); a=a.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.genre||"").toLowerCase().includes(q)||(x.badge||"").toLowerCase().includes(q)); }
  if (sortBy==="views") a.sort((x,y)=>(y.views||0)-(x.views||0));
  else if (sortBy==="alpha") a.sort((x,y)=>String(x.title).localeCompare(String(y.title)));
  else if (sortBy==="new") a.sort((x,y)=>(y.id||0)-(x.id||0));
  return a;
}

/* ===== KARTA ===== */
function card(it){
  const p=prog[it.id], pct=p&&p.d?Math.min(100,Math.round(p.t/p.d*100)):0;
  return `<div class="card" data-id="${it.id}"><div class="poster" style="${bgOf(it)}">
    <span class="tag ${isLive(it)?"live":""}">${esc(it.badge||(isLive(it)?T("live"):""))}</span>
    <button class="fav" data-fav="${it.id}">${favs.has(it.id)?"❤️":"🤍"}</button>
    ${it.poster?"":`<div class="ic">${ICON[it.content_type]||"📺"}</div><div class="nm">${esc(it.title)}</div>`}
    ${pct>2&&pct<97?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}</div>
    <div class="cd"><div class="t">${esc(it.title)}</div><div class="m"><span>${esc(it.match_time?"⏰ "+it.match_time:(it.genre||""))}</span><span>👁 ${it.views||0}</span></div></div></div>`;
}
const grid = a => a.length ? `<div class="grid ${layout==="list"?"list":""}">${a.map(card).join("")}</div>` : `<div class="empty"><b>🔎</b>${T("none")}</div>`;
const rowH = (t,a,go) => a.length ? `<div class="sec"><h2>${t}</h2>${go?`<a data-go="${go}">${T("more")}</a>`:""}</div><div class="hs">${a.map(card).join("")}</div>` : "";

/* ===== RENDER ===== */
function pillsH(){
  const gs=[...new Set(items.filter(x=>type==="all"||x.content_type===type).map(x=>x.genre).filter(Boolean))];
  return ["all","tv","football","movies","cartoons"].map(t=>`<div class="pill ${type===t?"on":""}" data-type="${t}">${T(t)}</div>`).join("")
   + (view==="home"&&type!=="all"?gs.map(g=>`<div class="pill sm ${genre.toLowerCase()===g.toLowerCase()?"on":""}" data-genre="${esc(g)}">${esc(g)}</div>`).join(""):"");
}
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  $("#bLang").textContent=LANG.toUpperCase();
  $("#pills").style.display=(view==="home"||view==="favs")?"flex":"none";
  $("#pills").innerHTML=pillsH();
  const v=$("#view");
  if (loading && !items.length){ v.innerHTML=`<div class="wrap" style="padding-top:10px"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>`; return; }
  clearInterval(heroT);
  if (view==="profile") return profile(v);
  if (view==="search") return searchV(v);
  if (view==="favs"){ const a=filt(items.filter(x=>favs.has(x.id))); v.innerHTML=`<div class="wrap"><div class="sec"><h2>${T("favs")} (${a.length})</h2></div>${favs.size?grid(a):`<div class="empty"><b>❤️</b>${T("nofav")}</div>`}</div>`; return; }
  if (type==="all"){
    const hero=top(items).slice(0,5);
    const recent=hist.map(h=>items.find(x=>x.id===h.id)).filter(Boolean).slice(0,10);
    v.innerHTML=`<div class="wrap">
      <div class="hero" id="hero">${hero.map(it=>`<div class="slide" data-id="${it.id}" style="${bgOf(it)}"><span class="tag ${isLive(it)?"live":""}">${esc(it.badge||T("live"))}</span><h3>${esc(it.title)}</h3><p>${esc(it.genre||"")} • 👁 ${it.views||0}</p><button class="go">▶ ${T("free").slice(3)}</button></div>`).join("")}</div>
      <div class="dots" id="dots">${hero.map((_,i)=>`<b class="${i?"":"on"}"></b>`).join("")}</div>
      ${rowH(T("recent"),recent)}${rowH(T("nowlive"),top(items.filter(isLive)).slice(0,10))}${rowH(T("trend"),top(items).slice(0,10))}
      ${rowH(T("football"),byType("football"),"football")}${rowH(T("tv"),byType("tv"),"tv")}${rowH(T("movies"),byType("movies"),"movies")}${rowH(T("cartoons"),byType("cartoons"),"cartoons")}</div>`;
    const h=$("#hero"); if(h&&hero.length>1){ let i=0; h.onscroll=()=>{ const n=Math.round(h.scrollLeft/h.clientWidth); document.querySelectorAll("#dots b").forEach((d,k)=>d.classList.toggle("on",k===n)); i=n; };
      heroT=setInterval(()=>{ i=(i+1)%hero.length; h.scrollTo({left:i*h.clientWidth,behavior:"smooth"}); },5000); }
  } else {
    const a=filt(items);
    v.innerHTML=`<div class="wrap"><div class="tools"><button class="lucky" id="lucky">${T("lucky")}</button>
      <select class="sel" id="sort"><option value="default">${T("sort")}</option><option value="views" ${sortBy==="views"?"selected":""}>${T("pop")}</option><option value="alpha" ${sortBy==="alpha"?"selected":""}>${T("az")}</option><option value="new" ${sortBy==="new"?"selected":""}>${T("newest")}</option></select>
      <button class="ib" id="layoutBtn">${layout==="grid"?"☰":"▦"}</button></div>
      <div class="sec" style="margin-top:8px"><h2>${T(type)} (${a.length})</h2></div>${grid(a)}</div>`;
  }
}

function searchV(v){
  v.innerHTML=`<div class="wrap"><div class="search"><span>🔍</span><input id="q" value="${esc(query)}" placeholder="${T("ph")}" autocomplete="off"></div>
    <div id="res"></div></div>`;
  resultsV();
}
function resultsV(){
  const r=$("#res"); if(!r) return;
  if (!query){
    const gs=[...new Set(items.map(x=>x.genre).filter(Boolean))].slice(0,14);
    r.innerHTML=(sh.length?`<div class="sec"><h2>${T("hist")}</h2><a id="shClear">${T("clearS")}</a></div><div class="chips">${sh.map(s=>`<div class="pill sm" data-q="${esc(s)}">🕘 ${esc(s)}</div>`).join("")}</div>`:"")
      +`<div class="sec"><h2>${T("genre")}</h2></div><div class="chips">${gs.map(g=>`<div class="pill sm" data-q="${esc(g)}">${esc(g)}</div>`).join("")}</div>`
      +`<div class="sec"><h2>${T("popular")}</h2></div>${grid(top(items).slice(0,8))}`;
  } else r.innerHTML=grid(filt(items).filter(()=>true));
}
function saveSearch(){ if(query.length>1){ sh=[query,...sh.filter(s=>s!==query)].slice(0,8); ls.set("uzstv_sh",sh); } }

function profile(v){
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  const nm=u?((u.first_name||"")+" "+(u.last_name||"")).trim():"Guest";
  const av=u&&u.photo_url?`background-image:url('${esc(u.photo_url)}')`:"";
  v.innerHTML=`<div class="wrap" style="padding-top:14px">
   <div class="pcard who"><div class="av" style="${av}">${av?"":esc(nm[0]||"U")}</div><div><h3 style="margin:0">${esc(nm)}</h3><p>${u?"@"+esc(u.username||"—")+" • ID "+u.id:""}</p><p>${T("free")}</p></div></div>
   <div class="pcard"><h3>📊 ${T("stats")}</h3><div class="stats"><div><b>${items.length}</b><span>${T("tot")}</span></div><div><b>${favs.size}</b><span>${T("favs")}</span></div><div><b>${hist.length}</b><span>${T("watched")}</span></div></div></div>
   <div class="pcard"><h3>🎨 ${T("theme")}</h3><div class="chips" style="margin-top:0"><div class="pill sm ${document.documentElement.dataset.theme==="dark"?"on":""}" data-th="dark">Dark</div><div class="pill sm ${document.documentElement.dataset.theme==="black"?"on":""}" data-th="black">AMOLED</div><div class="pill sm ${document.documentElement.dataset.theme==="light"?"on":""}" data-th="light">Light</div></div>
     <h3 style="margin-top:12px">${T("accent")}</h3><div class="sw">${ACC.map((a,i)=>`<i data-acc="${i}" class="${accent===i?"on":""}" style="background:linear-gradient(135deg,${a[0]},${a[1]})"></i>`).join("")}</div>
     <h3 style="margin-top:14px">${T("autoNext")}</h3><div class="pill sm ${autoNext?"on":""}" data-an style="display:inline-block">${autoNext?T("on"):T("off")}</div></div>
   <button class="btn g" id="pRefresh">${T("refresh")}</button><button class="btn g" id="pClear">${T("clearH")}</button>
   ${meta.bot?`<button class="btn" id="pBot">${T("bot")}</button>`:""}</div>`;
}

/* ===== PLEYER ===== */
const setOver = h => { const o=$("#vover"); o.innerHTML=h||""; o.classList.toggle("show",!!h); };
const SPEEDS=[1,1.25,1.5,2,0.75], SLEEPS=[0,15,30,60];

function openPlayer(id){
  const it=items.find(x=>x.id===id); if(!it) return;
  cur=it; retries=0; speedI=0; hap("medium");
  it.views=(it.views||0)+1;
  hist=[{id,t:Date.now()},...hist.filter(h=>h.id!==id)].slice(0,30); ls.set("uzstv_hist",hist);
  if (API_URL&&tg&&tg.initData) fetch(API_URL.replace(/\/$/,"")+"/api/view/"+id,{method:"POST",headers:{"X-Init-Data":tg.initData}}).catch(()=>{});
  paint(); $("#player").classList.add("open"); $("#player").scrollTop=0; document.body.style.overflow="hidden";
  if (tg) tg.BackButton.show();
  play(it.url);
}
function paint(){
  const it=cur;
  $("#pTitle").textContent=it.title; $("#iTitle").textContent=it.title;
  $("#cFav").textContent=favs.has(it.id)?"❤️":"🤍"; $("#cSpeed").textContent=SPEEDS[speedI]+"x"; $("#cSpeed").style.display=isLive(it)?"none":"";
  $("#iMeta").innerHTML=[`<span>${ICON[it.content_type]||"📺"} ${esc(it.badge||"")}</span>`,`<span>🎭 ${esc(it.genre||"-")}</span>`,it.language?`<span>🌐 ${esc(it.language.toUpperCase())}</span>`:"",`<span>👁 ${it.views||0}</span>`,it.match_time?`<span>⏰ ${esc(it.match_time)}</span>`:"",`<span>${T("free")}</span>`].join("");
  $("#simT").textContent=T("similar");
  $("#simRow").innerHTML=items.filter(x=>x.content_type===it.content_type).map(x=>`<div class="row ${x.id===it.id?"cur":""}" data-id="${x.id}"><div class="th" style="${bgOf(x)}">${x.poster?"":(ICON[x.content_type]||"📺")}</div><div class="tt">${esc(x.title)}<small>${esc(x.genre||"")} • 👁 ${x.views||0}</small></div><span>${x.id===it.id?"▶":""}</span></div>`).join("");
}
function destroy(){
  if (hls){ hls.destroy(); hls=null; }
  const v=$("#vbox video, #vbox iframe"); if(v){ try{ v.pause&&v.pause(); v.removeAttribute&&v.removeAttribute("src"); v.load&&v.load(); }catch(e){} v.remove(); }
  $("#cQual").style.display="none";
}
function play(url){
  destroy(); setOver('<div class="spin"></div>');
  if (location.protocol==="https:"&&url.startsWith("http://")) url="https://"+url.slice(7);
  const box=$("#vbox"), yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);
  if (yt){ const f=document.createElement("iframe"); f.src="https://www.youtube.com/embed/"+yt[1]+"?autoplay=1&playsinline=1"; f.allow="autoplay; fullscreen; picture-in-picture"; f.allowFullscreen=true; box.prepend(f); setOver(""); return; }
  const video=document.createElement("video"); video.controls=true; video.autoplay=true; video.playsInline=true; video.setAttribute("playsinline",""); box.prepend(video);
  const id=cur.id; let last=0;
  video.addEventListener("playing",()=>setOver("")); video.addEventListener("waiting",()=>setOver('<div class="spin"></div>')); video.addEventListener("error",fail);
  video.addEventListener("loadedmetadata",()=>{ if(!isLive(cur)&&isFinite(video.duration)){ const p=prog[id]; if(p&&p.t>20&&p.t<video.duration-20) video.currentTime=p.t; video.playbackRate=SPEEDS[speedI]; } });
  video.addEventListener("timeupdate",()=>{ if(isLive(cur)||!isFinite(video.duration)||Date.now()-last<4000) return; last=Date.now(); prog[id]={t:video.currentTime,d:video.duration}; ls.set("uzstv_prog",prog); });
  video.addEventListener("ended",()=>{ if(!isLive(cur)){ delete prog[id]; ls.set("uzstv_prog",prog); if(autoNext) step(1); } });
  if (/\.m3u8/i.test(url)){
    if (window.Hls&&Hls.isSupported()){
      hls=new Hls({lowLatencyMode:true,maxBufferLength:30,enableWorker:true}); hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{ video.play().catch(()=>{}); if(d.levels.length>1){ const q=$("#cQual"); q.innerHTML=`<option value="-1">${T("quality")}: ${T("auto")}</option>`+d.levels.map((l,i)=>`<option value="${i}">${l.height?l.height+"p":Math.round(l.bitrate/1000)+"k"}</option>`).join(""); q.style.display=""; } });
      hls.on(Hls.Events.ERROR,(_,e)=>{ if(!e.fatal) return;
        if (e.type===Hls.ErrorTypes.NETWORK_ERROR&&retries<3){ retries++; setTimeout(()=>hls&&hls.startLoad(),1200*retries); }
        else if (e.type===Hls.ErrorTypes.MEDIA_ERROR&&retries<3){ retries++; hls.recoverMediaError(); } else fail(); });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")){ video.src=url; video.play().catch(()=>{}); } else fail();
  } else { video.src=url; video.play().catch(()=>{}); }
}
const fail = () => setOver(`<div style="font-size:30px">⚠️</div><div>${T("err")}</div><button id="vRetry">${T("retry")}</button>`);
function closePlayer(){
  destroy(); cur=null; clearTimeout(sleepT); sleepI=0; $("#cSleep").classList.remove("on");
  $("#player").classList.remove("open"); document.body.style.overflow=""; if(tg) tg.BackButton.hide(); render();
}
function step(dir){
  if (!cur) return;
  const l=items.filter(x=>x.content_type===cur.content_type); if(!l.length) return;
  const i=l.findIndex(x=>x.id===cur.id); openPlayer(l[(i+dir+l.length)%l.length].id);
}
function toggleFav(id){ if(favs.has(id)){ favs.delete(id); toast(T("removed")); } else { favs.add(id); toast(T("added")); } ls.set("uzstv_favs",[...favs]); hap(); }
function cycleSleep(){
  sleepI=(sleepI+1)%SLEEPS.length; clearTimeout(sleepT); const m=SLEEPS[sleepI];
  $("#cSleep").classList.toggle("on",!!m); $("#cSleep").textContent=m?"⏱ "+m:"⏱";
  if (m){ toast(T("sleep")+": "+m+" min"); sleepT=setTimeout(closePlayer,m*60000); } else toast(T("sleepOff"));
}
function seek(side){
  const v=$("#vbox video"); if(!v||!isFinite(v.duration)||isLive(cur)) return;
  v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+(side==="L"?-10:10)));
  const e=$(side==="L"?"#sL":"#sR"); e.style.display="flex"; setTimeout(()=>e.style.display="none",450);
}

/* ===== HODISALAR ===== */
document.addEventListener("click",e=>{
  const t=e.target, fb=t.closest("[data-fav]");
  if (fb){ e.stopPropagation(); const id=+fb.dataset.fav; toggleFav(id); fb.textContent=favs.has(id)?"❤️":"🤍"; if(view==="favs") render(); return; }
  const row=t.closest(".row"); if(row&&row.dataset.id) return openPlayer(+row.dataset.id);
  const c=t.closest(".card, .slide"); if(c&&c.dataset.id) return openPlayer(+c.dataset.id);
  const nv=t.closest("#nav button"); if(nv){ view=nv.dataset.v; if(view!=="search") query=""; genre="all"; sortBy="default"; hap(); render(); window.scrollTo({top:0}); return; }
  const ty=t.closest("[data-type]"); if(ty){ type=ty.dataset.type; genre="all"; sortBy="default"; hap(); render(); return; }
  const go=t.closest("[data-go]"); if(go){ view="home"; type=go.dataset.go; render(); window.scrollTo({top:0}); return; }
  const g=t.closest("[data-genre]"); if(g){ genre=genre===g.dataset.genre?"all":g.dataset.genre; return render(); }
  const q=t.closest("[data-q]"); if(q){ query=q.dataset.q; saveSearch(); return searchV($("#view")); }
  const th=t.closest("[data-th]"); if(th){ document.documentElement.dataset.theme=th.dataset.th; localStorage.setItem("uzstv_theme",th.dataset.th); return render(); }
  const ac=t.closest("[data-acc]"); if(ac){ accent=+ac.dataset.acc; ls.set("uzstv_acc",accent); applyAccent(); return render(); }
  if (t.closest("[data-an]")){ autoNext=!autoNext; ls.set("uzstv_an",autoNext); return render(); }
  switch(t.id){
    case "lucky": case "bLucky": { if(items.length) openPlayer(items[Math.floor(Math.random()*items.length)].id); return; }
    case "layoutBtn": layout=layout==="grid"?"list":"grid"; ls.set("uzstv_layout",layout); return render();
    case "shClear": sh=[]; ls.set("uzstv_sh",sh); return resultsV();
    case "pRefresh": return loadData(true);
    case "pClear": hist=[]; prog={}; ls.set("uzstv_hist",hist); ls.set("uzstv_prog",prog); toast(T("cleared")); return render();
    case "pBot": return tg.openTelegramLink("https://t.me/"+meta.bot);
    case "pClose": return closePlayer();
    case "cPrev": return step(-1);
    case "cNext": return step(1);
    case "cFav": if(cur){ toggleFav(cur.id); $("#cFav").textContent=favs.has(cur.id)?"❤️":"🤍"; } return;
    case "cSleep": return cycleSleep();
    case "cSpeed": { speedI=(speedI+1)%SPEEDS.length; const v=$("#vbox video"); if(v) v.playbackRate=SPEEDS[speedI]; t.textContent=SPEEDS[speedI]+"x"; return; }
    case "cRep": if(cur){ if(API_URL&&tg&&tg.initData) fetch(API_URL.replace(/\/$/,"")+"/api/report/"+cur.id,{method:"POST",headers:{"X-Init-Data":tg.initData}}).catch(()=>{}); toast(T("reported")); } return;
    case "cShare": if(cur){ const link=meta.bot?"https://t.me/"+meta.bot:location.href; const u="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent("📺 "+cur.title+" — Uzs TV");
      if(tg) tg.openTelegramLink(u); else { navigator.clipboard&&navigator.clipboard.writeText(link); toast(T("copied")); } } return;
    case "cPip": { const v=$("#vbox video"); if(v&&document.pictureInPictureEnabled) v.requestPictureInPicture().catch(()=>toast(T("pip"))); else toast(T("pip")); return; }
    case "cFs": { const b=$("#vbox"), v=$("#vbox video")||b; if(v.webkitEnterFullscreen) v.webkitEnterFullscreen(); else (b.requestFullscreen||b.webkitRequestFullscreen).call(b); return; }
    case "vRetry": if(cur){ retries=0; play(cur.url); } return;
  }
});
$("#vbox").addEventListener("dblclick",e=>{ const r=e.currentTarget.getBoundingClientRect(); seek(e.clientX-r.left<r.width/2?"L":"R"); });
document.addEventListener("input",e=>{ if(e.target.id==="q"){ query=e.target.value.trim(); clearTimeout(window._qt); window._qt=setTimeout(resultsV,180); } });
document.addEventListener("keydown",e=>{ if(e.target.id==="q"&&e.key==="Enter"){ saveSearch(); e.target.blur(); } if(e.key==="Escape"&&cur) closePlayer(); if(cur&&!e.target.matches("input,select")){ if(e.key==="ArrowRight") seek("R"); if(e.key==="ArrowLeft") seek("L"); } });
document.addEventListener("change",e=>{ if(e.target.id==="sort"){ sortBy=e.target.value; render(); } if(e.target.id==="cQual"&&hls) hls.currentLevel=+e.target.value; });
$("#bTheme").onclick=()=>{ const o=["dark","black","light"], n=o[(o.indexOf(document.documentElement.dataset.theme)+1)%3]; document.documentElement.dataset.theme=n; localStorage.setItem("uzstv_theme",n); hap(); if(view==="profile") render(); };
$("#bLang").onclick=()=>{ LANG=LANG==="uz"?"ru":"uz"; localStorage.setItem("uzstv_lang",LANG); if(cur) paint(); render(); };
if (tg) tg.BackButton.onClick(()=>{ if($("#player").classList.contains("open")) closePlayer(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&cur&&hls) hls.startLoad(); });
window.addEventListener("offline",()=>toast(T("offline")));

/* ===== BOSHLASH ===== */
document.documentElement.dataset.theme=localStorage.getItem("uzstv_theme")||(tg&&tg.colorScheme)||"dark";
loadData().finally(()=>{ const s=$("#splash"); s.style.opacity=0; setTimeout(()=>s.remove(),450); });
setInterval(()=>{ if(!cur&&!document.hidden&&view!=="search") loadData(); },5*60*1000);
</script>
</body>
</html>
