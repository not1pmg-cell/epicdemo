<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#121212"/>
    <title>Epic Gift</title>

    <base href="https://epicgift.app/">

    <style>
      html, body {
        background-color: #121212;
        margin: 0;
        padding: 0;
        touch-action: pan-x pan-y;
      }
    </style>

    <script>
      (function() {
        var rawUser = JSON.stringify({
          id: 7691140042,
          first_name: "Demo",
          last_name: "User",
          username: "demo_user",
          language_code: "uz"
        });

        var fakeInitData = "query_id=AAHdF60uAAAAAN0XrS4Demo&user=" + encodeURIComponent(rawUser) + "&auth_date=1728588000&hash=mockhash";

        // URL parametrlarini to'ldirish
        if (!window.location.hash || !window.location.hash.includes("tgWebAppData")) {
          window.location.hash = "tgWebAppData=" + encodeURIComponent(fakeInitData) + "&tgWebAppVersion=7.10&tgWebAppPlatform=tdesktop&tgWebAppThemeParams=%7B%22bg_color%22%3A%22%23121212%22%7D";
        }

        // Telegram WebView ichki ko'prigi (SDK tekshiruvidan o'tish uchun)
        window.TelegramWebviewProxy = {
          postEvent: function() {}
        };

        // Telegram WebApp obyekti
        window.Telegram = {
          WebApp: {
            initData: fakeInitData,
            initDataUnsafe: {
              query_id: "AAHdF60uAAAAAN0XrS4Demo",
              user: JSON.parse(rawUser),
              auth_date: "1728588000",
              hash: "mockhash"
            },
            version: "7.10",
            platform: "tdesktop",
            colorScheme: "dark",
            themeParams: { bg_color: "#121212", text_color: "#ffffff" },
            isExpanded: true,
            viewportHeight: window.innerHeight,
            viewportStableHeight: window.innerHeight,
            headerColor: "#121212",
            backgroundColor: "#121212",
            ready: function() {},
            expand: function() {},
            close: function() {},
            setHeaderColor: function() {},
            setBackgroundColor: function() {},
            disableVerticalSwipes: function() {},
            onEvent: function() {},
            offEvent: function() {},
            sendData: function() {},
            openTelegramLink: function() {},
            openLink: function() {},
            MainButton: { show: function(){}, hide: function(){}, setText: function(){}, isVisible: false },
            BackButton: { show: function(){}, hide: function(){}, isVisible: false }
          }
        };
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script type="module" crossorigin src="http://localhost:8000/main-Cz7lpHCh.js"></script>
  </head>

    <div id="root"></div>
  </body>
