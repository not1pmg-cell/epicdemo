<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <title>Epic Gift</title>

    <base href="https://not1pmg-cell.github.io/epicdemo/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background: #121212;
        color: #fff;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #root { width: 100%; min-height: 100vh; }

      .boot-error {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: #121212;
        color: #fff;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      window.__epicJsLoaded = false;

      window.addEventListener("error", function (event) {
        console.error("Global error:", event.error || event.message);
      });

      window.addEventListener("unhandledrejection", function (event) {
        console.error("Unhandled rejection:", event.reason);
      });
    </script>

    <script
      type="module"
      crossorigin
      src="https://not1pmg-cell.github.io/epicdemo/main-Cz7lpHCh.js"
      onload="window.__epicJsLoaded = true"
    ></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <div class="boot-error">Epic Gift yuklanmoqda…</div>
    </div>

    <script>
      setTimeout(function () {
        var root = document.getElementById("root");
        var tg = window.Telegram && window.Telegram.WebApp;

        if (root && root.textContent.trim() === "Epic Gift yuklanmoqda…") {
          root.innerHTML =
            "<div class='boot-error'>" +
            "<b>Diagnostika</b><br><br>" +
            "Telegram: " + (tg ? "HA" : "YO‘Q") + "<br>" +
            "Platform: " + (tg && tg.platform ? tg.platform : "aniqlanmadi") + "<br>" +
            "initData: " + (tg && tg.initData ? "BOR" : "YO‘Q") + "<br>" +
            "JS yuklandi: " + (window.__epicJsLoaded ? "HA" : "YO‘Q") + "<br>" +
            "</div>";
        }
      }, 6000);
    </script>
  </body>
</html>
