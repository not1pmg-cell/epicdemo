<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#121212"/>
    <title>Epic Gift</title>

    <base href="https://epicgift.app/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
    </style>

    <!-- Asl server xatolarini ushlab qolib, "High load" chiqishini to'xtatuvchi mock fetch -->
    <script>
      const originalFetch = window.fetch;
      window.fetch = async function(...args) {
        const url = args[0] ? args[0].toString() : "";
        if (url.includes("/api/") || url.includes("/user") || url.includes("/auth") || url.includes("/init")) {
          return new Response(JSON.stringify({
            status: "ok",
            success: true,
            user: {
              id: 7691140042,
              balance: 10000,
              tickets: 50,
              stars: 500,
              level: 5,
              gifts: []
            },
            data: {}
          }), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          });
        }
        return originalFetch.apply(this, args);
      };
    </script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-hub-bg.webp" fetchpriority="high"/>
    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-card-upgrade.webp?v=5" fetchpriority="high"/>
    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-card-plinko.webp?v=5" fetchpriority="high"/>
    <link rel="preload" as="image" href="https://epicgift.app/assets/play-hub/home-card-mines.webp?v=3" fetchpriority="high"/>
