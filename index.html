<!doctype html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
    </style>

    <!-- 1. Barcha tarmoq (Fetch, XHR, WebSocket) xatolarini to'suvchi va "High load"ni yo'qotuvchi emulyator -->
    <script>
      (function() {
        const dummyResponseData = {
          success: true,
          status: "ok",
          code: 0,
          data: {
            user: {
              id: 7691140042,
              username: "demo_user",
              balance: 50000,
              tickets: 100,
              level: 10,
              stars: 1000
            },
            config: { maintenance: false, overload: false },
            items: [],
            gifts: []
          }
        };

        // Fetch so'rovlarini tutib qolish
        const rawFetch = window.fetch;
        window.fetch = async function(...args) {
          try {
            const res = await rawFetch.apply(this, args);
            if (res.ok) return res;
            return new Response(JSON.stringify(dummyResponseData), {
              status: 200,
              headers: { "Content-Type": "application/json" }
            });
          } catch (e) {
            return new Response(JSON.stringify(dummyResponseData), {
              status: 200,
              headers: { "Content-Type": "application/json" }
            });
          }
        };

        // XMLHttpRequest (XHR) so'rovlarini tutib qolish
        const rawOpen = XMLHttpRequest.prototype.open;
        const rawSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url) {
          this._url = url;
          return rawOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function() {
          this.addEventListener('error', (e) => {
            Object.defineProperty(this, 'status', { value: 200 });
            Object.defineProperty(this, 'responseText', { value: JSON.stringify(dummyResponseData) });
          });
          return rawSend.apply(this, arguments);
        };

        // WebSocket xatosini to'xtatish (ulanish uzilmasligi uchun)
        const RawWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          const ws = new EventTarget();
          ws.url = url;
          ws.readyState = 1; // OPEN
          ws.send = function(data) {};
          ws.close = function() {};
          setTimeout(() => {
            if (ws.onopen) ws.onopen(new Event('open'));
            ws.dispatchEvent(new Event('open'));
          }, 100);
          return ws;
        };
      })();
    </script>

    <!-- 2. Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
