<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Uzs TV - Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-base: #07090e; --bg-surface: #101726; --bg-card: #182238;
            --accent: #e50914; --text-main: #ffffff; --text-muted: #94a3b8; --border: #22304d;
            --shadow: rgba(0, 0, 0, 0.4);
        }
        :root[data-theme="light"] {
            --bg-base: #f1f5f9; --bg-surface: #ffffff; --bg-card: #ffffff;
            --accent: #e50914; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0 0 80px 0; background-color: var(--bg-base); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        
        header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px var(--shadow); }
        .logo { font-size: 20px; font-weight: 900; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .action-btn, .lang-select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; outline: none; }

        .search-area { padding: 14px 20px 6px 20px; }
        .search-wrapper { position: relative; }
        .search-wrapper input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 12px; border: 1px solid var(--border); background-color: var(--bg-surface); color: var(--text-main); font-size: 14px; outline: none; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; }

        /* Filtrlash va Tartiblash paneli */
        .filter-sort-row { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 10px 20px; }
        .genres-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; }
        .genres-scroll::-webkit-scrollbar { display: none; }
        .genre-chip { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 16px; font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .genre-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        
        .sort-select { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); padding: 5px 8px; border-radius: 12px; font-size: 11px; outline: none; margin-left: 8px; }

        .hero-banner { margin: 6px 20px 12px 20px; height: 150px; border-radius: 16px; background: linear-gradient(135deg, #1e293b, #0f172a); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; box-shadow: 0 8px 24px var(--shadow); background-size: cover; background-position: center; cursor: pointer; }
        .hero-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); z-index: 1; }
        .hero-content { position: relative; z-index: 2; }
        .hero-tag { background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; display: inline-block; margin-bottom: 4px; }
        .hero-title { font-size: 17px; font-weight: 800; margin: 0 0 2px 0; color: #fff; }
        .hero-desc { font-size: 11px; color: #cbd5e1; margin: 0; }

        .section-title { font-size: 15px; font-weight: 800; margin: 10px 20px 8px 20px; display: flex; justify-content: space-between; align-items: center; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 20px 20px 20px; }
        .movie-card { background-color: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 4px 14px var(--shadow); position: relative; }
        
        .poster-box { height: 150px; background-color: #1a2233; position: relative; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; }
        .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; z-index: 2; }
        .views-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #cbd5e1; font-size: 10px; padding: 2px 6px; border-radius: 4px; z-index: 2; }
        .match-time { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(229, 9, 20, 0.9); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 700; text-align: center; z-index: 2; }
        
        .fav-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 16px; z-index: 5; }
        .fav-btn.active { color: #facc15; background: rgba(250, 204, 21, 0.2); }

        .card-details { padding: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .movie-title { font-size: 13px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-category { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--bg-surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 20px var(--shadow); }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent); }
        .nav-item span { font-size: 18px; }

        /* Modal qism */
        .player-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-base); display: none; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .modal-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .modal-heading { font-size: 15px; font-weight: 700; margin: 0; max-width: 50%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .player-header-controls { display: flex; gap: 6px; align-items: center; }
        .quality-select, .action-modal-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; outline: none; }
        .exit-btn { background-color: var(--accent); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; }
        
        .video-container { width: 100%; height: 260px; background: #000; position: relative; }
        video, iframe { width: 100%; height: 100%; border: none; outline: none; }

        .info-panel { padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
        .info-title { font-size: 18px; font-weight: 800; margin: 0; }
        .info-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 12px; }

        .not-found { grid-container: 1 / -1; text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Uzs TV</div>
    <div class="header-btns">
        <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
            <option value="uz">UZ</option>
            <option value="ru">RU</option>
            <option value="en">EN</option>
        </select>
        <button class="action-btn" onclick="filterHistory()">🕒 Tarix</button>
        <button class="action-btn" onclick="filterFavorites()">⭐</button>
        <button class="action-btn" onclick="toggleTheme()">☀️/🌙</button>
    </div>
</header>

<div class="search-area">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Qidirish..." oninput="renderItems()">
    </div>
</div>

<!-- Janrlar va Tartiblash (Sort) paneli -->
<div class="filter-sort-row">
    <div class="genres-scroll" id="genresScroll">
        <div class="genre-chip active" onclick="filterGenre('all', this)">Barchasi</div>
        <div class="genre-chip" onclick="filterGenre('Komediya', this)">Komediya</div>
        <div class="genre-chip" onclick="filterGenre('Jangari', this)">Jangari</div>
        <div class="genre-chip" onclick="filterGenre('Drama', this)">Drama</div>
        <div class="genre-chip" onclick="filterGenre('Multfilm', this)">Multfilm</div>
        <div class="genre-chip" onclick="filterGenre('Sport', this)">Sport</div>
    </div>
    <select class="sort-select" id="sortSelect" onchange="renderItems()">
        <option value="default">Saralash</option>
        <option value="views">🔥 Trend (Ko'p ko'rilgan)</option>
        <option value="new">✨ Yangi qo'shilgan</option>
        <option value="alpha">AZ Alifbo</option>
    </select>
</div>

<div class="hero-banner" id="heroBanner" onclick="openFeatured()">
    <div class="hero-content">
        <div class="hero-tag" id="heroTagText">Premyera</div>
        <h2 class="hero-title" id="heroTitle">Yuklanmoqda...</h2>
        <p class="hero-desc" id="heroDesc">Eng sara premyeralar</p>
    </div>
</div>

<div class="section-title">
    <span id="sectionHeaderTitle">Barcha Kontentlar</span>
</div>

<div class="grid-container" id="grid">Yuklanmoqda...</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="filterCategory('all', this)"><span>🏠</span><span id="navAll">Barchasi</span></button>
    <button class="nav-item" onclick="filterCategory('tv', this)"><span>📺</span><span id="navTv">TV</span></button>
    <button class="nav-item" onclick="filterCategory('cartoons', this)"><span>🧸</span><span id="navCart">Multfilm</span></button>
    <button class="nav-item" onclick="filterCategory('movies', this)"><span>🎬</span><span id="navMov">Kino</span></button>
    <button class="nav-item" onclick="filterCategory('football', this)"><span>⚽</span><span id="navFoot">Futbol</span></button>
</nav>

<div class="player-modal" id="playerModal">
    <div class="modal-top">
        <h3 class="modal-heading" id="modalTitle">Pleyer</h3>
        <div class="player-header-controls">
            <button class="action-modal-btn" onclick="shareCurrentMovie()">📤 Ulashish</button>
            <select class="quality-select" id="qualitySelect" onchange="changeQuality(this.value)">
                <option value="1080">1080p</option>
                <option value="720" selected>720p</option>
                <option value="360">360p</option>
            </select>
            <button class="exit-btn" onclick="closePlayer()">Yopish</button>
        </div>
    </div>
    <div class="video-container">
        <video id="nativePlayer" controls playsinline style="display:none; width:100%; height:100%;"></video>
        <iframe id="ytPlayer" allowfullscreen allow="autoplay; encrypted-media" style="display:none; width:100%; height:100%;"></iframe>
    </div>
    <div class="info-panel">
        <h2 class="info-title" id="infoTitle">Nomi</h2>
        <div class="info-meta">
            <span id="infoGenre">Janr: -</span>
            <span id="infoViews">👁 Ko'rishlar: 0</span>
        </div>
    </div>
</div>

<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let items = [];
    let currentCategory = 'all';
    let currentGenre = 'all';
    let onlyFavorites = false;
    let onlyHistory = false;
    let favorites = JSON.parse(localStorage.getItem('uzstv_favs') || '[]');
    let watchHistory = JSON.parse(localStorage.getItem('uzstv_history') || '[]');
    let featuredItem = null;
    let activeMovie = null;

    const translations = {
        uz: { all: "Barchasi", tv: "TV", cart: "Multfilm", mov: "Kino", foot: "Futbol", search: "Qidirish..." },
        ru: { all: "Все", tv: "ТВ", cart: "Мультфильм", mov: "Кино", foot: "Футбол", search: "Поиск..." },
        en: { all: "All", tv: "TV", cart: "Cartoons", mov: "Movies", foot: "Football", search: "Search..." }
    };

    let savedTheme = localStorage.getItem('uzstv_theme') || 'dark';
    document.documentElement.setAttribute("data-theme", savedTheme);

    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        localStorage.setItem('uzstv_theme', next);
    }

    function changeLang(lang) {
        localStorage.setItem('uzstv_lang', lang);
        document.getElementById('navAll').textContent = translations[lang].all;
        document.getElementById('navTv').textContent = translations[lang].tv;
        document.getElementById('navCart').textContent = translations[lang].cart;
        document.getElementById('navMov').textContent = translations[lang].mov;
        document.getElementById('navFoot').textContent = translations[lang].foot;
        document.getElementById('searchInput').placeholder = translations[lang].search;
    }

    async function loadData() {
        try {
            const res = await fetch('data.json');
            const data = await res.json();
            items = data.items || [];
            
            let premieres = items.filter(x => x.content_type === 'premiere');
            featuredItem = premieres.length > 0 ? premieres[0] : items[0];

            if (featuredItem) {
                document.getElementById('heroTitle').textContent = featuredItem.title;
                document.getElementById('heroDesc').textContent = `Janr: ${featuredItem.genre || 'Maxsus'}`;
                if (featuredItem.poster) {
                    document.getElementById('heroBanner').style.backgroundImage = `url('${featuredItem.poster}')`;
                }
            }

            renderItems();
            let savedLang = localStorage.getItem('uzstv_lang') || 'uz';
            document.getElementById('langSelect').value = savedLang;
            changeLang(savedLang);
        } catch (e) {
            document.getElementById('grid').innerHTML = `<div class="not-found">Ma'lumotlarni yuklab bo'lmadi</div>`;
        }
    }

    function openFeatured() {
        if (featuredItem) openPlayer(featuredItem.id);
    }

    function renderItems() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        
        let filtered = [...items];
        
        if (onlyFavorites) {
            filtered = filtered.filter(x => favorites.includes(x.id));
            document.getElementById('sectionHeaderTitle').textContent = "Saqlangan Sevimlilar";
        } else if (onlyHistory) {
            filtered = filtered.filter(x => watchHistory.includes(x.id));
            document.getElementById('sectionHeaderTitle').textContent = "Ko'rishlar tarixi (Davom etish)";
        } else if (currentCategory !== 'all') {
            filtered = filtered.filter(x => x.content_type === currentCategory);
        }

        if (currentGenre !== 'all') {
            filtered = filtered.filter(x => x.genre && x.genre.toLowerCase() === currentGenre.toLowerCase());
        }

        const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
        if (searchQuery) {
            filtered = filtered.filter(x => x.title.toLowerCase().includes(searchQuery));
        }

        // Saralash (Sorting) logikasi
        let sortVal = document.getElementById('sortSelect').value;
        if (sortVal === 'views') {
            filtered.sort((a, b) => (b.views || 0) - (a.views || 0));
        } else if (sortVal === 'new') {
            filtered.sort((a, b) => b.id - a.id);
        } else if (sortVal === 'alpha') {
            filtered.sort((a, b) => a.title.localeCompare(b.title));
        }

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="not-found">Hozircha hech narsa topilmadi</div>`;
            return;
        }

        filtered.forEach(item => {
            let posterStyle = item.poster ? `background-image: url('${item.poster}');` : "";
            let isFav = favorites.includes(item.id);
            let matchTimeBadge = item.match_time ? `<div class="match-time">⏰ ${item.match_time}</div>` : '';
            let viewsCount = item.views || 0;

            grid.innerHTML += `
                <div class="movie-card">
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${item.id})">★</button>
                    <div class="poster-box" style="${posterStyle}" onclick="openPlayer(${item.id})">
                        <div class="tag">${item.badge || 'TV'}</div>
                        ${matchTimeBadge}
                        <div class="views-badge">👁 ${viewsCount}</div>
                        ${!item.poster ? `<span>🎬 ${item.title}</span>` : ''}
                    </div>
                    <div class="card-details" onclick="openPlayer(${item.id})">
                        <p class="movie-title">${item.title}</p>
                        <div class="movie-category">
                            <span>${item.genre || ''}</span>
                            <span>👁 ${viewsCount}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        onlyFavorites = false;
        onlyHistory = false;
        document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
        if(btn) btn.classList.add('active');
        renderItems();
    }

    function filterGenre(genre, chip) {
        currentGenre = genre;
        document.querySelectorAll('.genre-chip').forEach(el => el.classList.remove('active'));
        if(chip) chip.classList.add('active');
        renderItems();
    }

    function filterFavorites() {
        onlyFavorites = !onlyFavorites;
        onlyHistory = false;
        renderItems();
    }

    function filterHistory() {
        onlyHistory = !onlyHistory;
        onlyFavorites = false;
        renderItems();
    }

    function toggleFav(id) {
        if (favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('uzstv_favs', JSON.stringify(favorites));
        renderItems();
    }

    function openPlayer(id) {
        activeMovie = items.find(x => x.id === id);
        if(!activeMovie) return;

        if (!watchHistory.includes(id)) {
            watchHistory.unshift(id);
            if (watchHistory.length > 20) watchHistory.pop();
            localStorage.setItem('uzstv_history', JSON.stringify(watchHistory));
        }

        activeMovie.views = (activeMovie.views || 0) + 1;

        document.getElementById("modalTitle").textContent = activeMovie.title;
        document.getElementById("infoTitle").textContent = activeMovie.title;
        document.getElementById("infoGenre").textContent = `Janr: ${activeMovie.genre || 'Maxsus'}`;
        document.getElementById("infoViews").textContent = `👁 Ko'rishlar: ${activeMovie.views}`;
        
        document.getElementById("playerModal").style.display = "flex";
        playVideoSource(activeMovie.url);
    }

    function playVideoSource(url) {
        let nativePlayer = document.getElementById("nativePlayer");
        let ytPlayer = document.getElementById("ytPlayer");

        if (url.includes("youtube.com") || url.includes("youtu.be")) {
            nativePlayer.style.display = "none";
            nativePlayer.pause();
            nativePlayer.src = "";
            ytPlayer.style.display = "block";
            
            let ytId = "";
            if (url.includes("youtu.be/")) ytId = url.split("youtu.be/")[1]?.split("?")[0];
            else if (url.includes("watch?v=")) ytId = url.split("watch?v=")[1]?.split("&")[0];
            ytPlayer.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        } else {
            ytPlayer.style.display = "none";
            ytPlayer.src = "";
            nativePlayer.style.display = "block";
            nativePlayer.src = url;
            nativePlayer.play();
        }
    }

    function shareCurrentMovie() {
        if(activeMovie) {
            let shareText = `Kino: ${activeTom = activeMovie.title}\nTomosha qilish: ${activeMovie.url}`;
            if (navigator.share) {
                navigator.share({ title: activeMovie.title, text: shareText, url: activeMovie.url });
            } else {
                navigator.clipboard.writeText(activeMovie.url);
                alert("Havola nusxalandi!");
            }
        }
    }

    function changeQuality(quality) {
        alert(`Video sifati ${quality}p ga o'zgartirildi`);
    }

    function closePlayer() {
        document.getElementById("playerModal").style.display = "none";
        document.getElementById("nativePlayer").pause();
        document.getElementById("nativePlayer").src = "";
        document.getElementById("ytPlayer").src = "";
        renderItems();
    }

    loadData();
</script>
</body>
</html>
